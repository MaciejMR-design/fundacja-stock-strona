function lang() { return localStorage.getItem('fs-lang') || 'en'; }

function personCard(p, l, t) {
  const el = document.createElement('a');
  el.className = 'person reveal';
  el.href = 'person.html#' + p.id;
  el.innerHTML =
    '<div class="photo"><img src="' + p.photo + '" alt="' + p.name + '" loading="lazy" decoding="async"></div>' +
    '<div class="meta"><h3>' + p.name + '</h3><span>' + p.role[l] + '</span>' +
    '<span class="view">' + t.viewProfile + ' →</span></div>';
  return el;
}

function renderTeam() {
  const l = lang();
  const t = Object.assign({}, PAGE_I18N.en, PAGE_I18N[l]);
  const people = window.PEOPLE || [];
  const cg = document.getElementById('councilGrid');
  const bg = document.getElementById('boardGrid');
  cg.innerHTML = ''; bg.innerHTML = '';
  people.filter(p => p.group === 'council').forEach(p => cg.appendChild(personCard(p, l, t)));
  people.filter(p => p.group === 'board').forEach(p => bg.appendChild(personCard(p, l, t)));
  if (window.observeReveals) window.observeReveals();
}

window.onLangChange = renderTeam;
