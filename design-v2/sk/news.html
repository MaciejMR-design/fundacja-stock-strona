function lang() { return localStorage.getItem('fs-lang') || 'en'; }

function renderNews() {
  const l = lang();
  const t = Object.assign({}, PAGE_I18N.en, PAGE_I18N[l]);
  const list = (window.ARTICLES || []).filter(x => !x.hidden);
  const feat = list[0];

  // featured
  document.getElementById('featured').href = 'article-' + feat.id + '.html';
  var fi = document.getElementById('featImg');
  fi.src = feat.img;
  fi.srcset = window.fsSrcset(feat.img);
  fi.sizes = '(max-width: 860px) 100vw, 560px';
  fi.alt = feat.title[l];
  document.getElementById('featCat').textContent = t['cat' + feat.cat];
  document.getElementById('featDate').textContent = feat.date[l];
  document.getElementById('featTitle').textContent = feat.title[l];
  document.getElementById('featLead').textContent = feat.lead[l];

  // grid (rest)
  const grid = document.getElementById('newsGrid');
  grid.innerHTML = '';
  list.slice(1).forEach(a => {
    const el = document.createElement('article');
    el.className = 'card reveal';
    el.dataset.cat = a.cat;
    el.innerHTML =
      '<a href="article-' + a.id + '.html" style="display:flex;flex-direction:column;flex:1;color:inherit;">' +
        '<div class="card-media"><img src="' + a.img + '" srcset="' + window.fsSrcset(a.img) + '" sizes="(max-width: 620px) 100vw, (max-width: 1020px) 50vw, 33vw" alt="" loading="lazy" decoding="async"><span class="cat">' + t['cat' + a.cat] + '</span></div>' +
        '<div class="card-body">' +
          '<time>' + a.date[l] + '</time>' +
          '<h3>' + a.title[l] + '</h3>' +
          '<p>' + a.lead[l] + '</p>' +
          '<span class="read-more" style="margin-top:4px;"><span>' + (l === 'pl' ? 'Czytaj więcej' : l === 'cz' ? 'Číst dále' : l === 'it' ? 'Leggi di più' : l === 'sk' ? 'Čítať ďalej' : l === 'de' ? 'Weiterlesen' : l === 'fr' ? 'Lire la suite' : 'Read more') + '</span> <span class="arr">→</span></span>' +
        '</div>' +
      '</a>';
    grid.appendChild(el);
  });

  // observe new reveal elements
  if (window.observeReveals) window.observeReveals();
  applyFilter(document.querySelector('.filters button.active')?.dataset.filter || 'all');
}

function applyFilter(cat) {
  let visible = 0;
  document.querySelectorAll('#newsGrid .card').forEach(card => {
    const show = cat === 'all' || card.dataset.cat === cat;
    card.classList.toggle('hidden-by-filter', !show);
    if (show) visible++;
  });
  const countEl = document.getElementById('newsCount');
  if (countEl) countEl.textContent = visible;
}

document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter(btn.dataset.filter);
  });
});

// newsletter (demo — no backend; sekcja obecnie wyłączona w HTML)
const nlForm = document.getElementById('nlForm');
if (nlForm) nlForm.addEventListener('submit', e => {
  e.preventDefault();
  const t = Object.assign({}, PAGE_I18N.en, PAGE_I18N[lang()]);
  const form = e.currentTarget;
  form.innerHTML = '<p style="margin:0;color:#fff;font-weight:600;">✓ ' + t.nlThanks + '</p>';
});

// re-render on language change (called by main.js applyLang)
window.onLangChange = renderNews;
</script>
