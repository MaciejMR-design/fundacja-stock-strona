<script>
const PAGE_I18N = /* CONTENT:PAGE_I18N */{"en":{"pageTitle":"About us","pageLead":"From emergency aid for refugees to a lasting platform for social and cultural projects — the story of the Stock Foundation.","badgeLabel":"Est. in Lublin","startedOverline":"How it has","startedTitle":"Started","startedP1":"The impetus to set up a charitable foundation came from the sudden influx of huge numbers of refugees from Ukraine, triggered by the Russian attack on 24 February 2022. Aware of the anticipated long-lasting conflict, we decided to set up a foundation to support Ukrainian refugees, particularly in Lublin, due to its close proximity to the Ukrainian border.","startedP2":"Since the beginning of the war, the City of Lublin was one of the major reception points for Ukrainian refugees and became one of the biggest refugee clusters in Poland. It has taken in over a million people, and approximately 60 thousand have stayed in Lublin permanently.","startedP3":"From its inception, the Stock Foundation focused on alleviating the crisis resulting from the influx of refugees — providing aid to schools accommodating refugee children, offering psychological support to those traumatized by the conflict, and facilitating employment opportunities for those affected.","souOverline":"Spirit of Ukraine","souTitle":"Our key initiatives for refugees","awardOverline":"Recognition","awardTitle":"Medal \"Lublin Bohaterom\"","awardText":"In 2023 the Mayor of Lublin, Dr Krzysztof Żuk, honored the Stock Foundation with the \"Lublin Bohaterom\" (Lublin to Its Heroes) Medal for its work during the humanitarian crisis.","awardQuote":"“In honor of great deeds and merits in the service of victims of the humanitarian crisis, with special recognition for the strategic support of the City of Lublin in bringing help to the Ukrainian Nation, and for the contribution to promoting noble values.”","awardSrc":"— Mayor of Lublin, Dr Krzysztof Żuk · Lublin, 2023","souLead":"To achieve its objectives, the Foundation launched the \"Spirit of Ukraine\" program in Lublin — a multi-faceted approach to help refugees find safety, work and community.","sou1T":"Psychological Support","sou1X":"Therapies led by qualified psychologists, providing emotional support and tools to cope with the trauma of war, in a safe space for open communication.","sou2T":"Integration Job Fairs","sou2X":"Regular meetings for refugees, offering opportunities to connect with employers and help with immigration issues — an inclusive platform to share experiences.","sou3T":"Music Scholarships","sou3X":"Funding music education for talented Ukrainian children, enabling them to pursue their passion, and supporting music teachers in their careers.","sou4T":"Vocational Training","sou4X":"Office training programs for refugees, increasing their employability and independence.","sou5T":"Support for Schools","sou5X":"Donations of equipment and materials for schools, supporting the integration of refugee children into the school community.","sou6T":"Polish Language Courses","sou6X":"Language courses for refugees, helping them integrate and increase their communication skills.","evoOverline":"How is it","evoTitle":"Evolving","evoLead":"From the beginning it was assumed that as the refugee crisis subsided, the Stock Foundation would become a platform for important social projects — engaging employees and recruiting volunteers. Today our work revolves around the accessibility of culture and art, addressing social isolation and empowering local communities.","tl1When":"2022 — Founding","tl1T":"Emergency refugee aid","tl1X":"The foundation is set up in Lublin in the first weeks of the war and launches the \"Spirit of Ukraine\" program.","tl2When":"2023–2024 — Growth","tl2T":"Advocacy of arts and culture","tl2X":"Championing arts and culture through awareness campaigns, educational programs and support for artists and cultural institutions.","ev1T":"Advocacy and Promotion of Arts and Culture","ev1X":"A commitment to championing arts and culture — through awareness campaigns, educational programs and support for artists and cultural institutions. See how a Flavours of Change grant transformed a kindergarten in Šišan, Croatia.","ev2T":"Art and Mental Health","ev2X":"Recognizing the positive influence of art on mental health — a continuity from the foundation’s first initiatives, addressing emotional well-being through culturally enriching activities and experiences.","ev3T":"Creative and Collective Activities","ev3X":"Encouraging people to spend time together and explore new ways to do so — events, workshops and initiatives that foster creativity and social interaction, motivating people to step out of their comfort zones.","tl3When":"Today","tl3T":"Art, mental health & community","tl3X":"Art Encounters, scholarships and creative collective activities that support mental health and bring people together — across generations.","ctaTitle":"See what we are doing right now","ctaNews":"Our latest actions","photoFestynAlt":"Community festival for Ukrainian families organized by the Stock Foundation","photoArtAlt":"An Art Encounter organized by the foundation","awardMedalAlt":"The „Lublin Bohaterom” medal awarded to the foundation","awardDiplomaAlt":"Diploma accompanying the „Lublin Bohaterom” medal for the Stock Foundation"},"pl":{"pageTitle":"O nas","pageLead":"Od pomocy doraźnej dla uchodźców do trwałej platformy projektów społecznych i kulturalnych — historia Fundacji Stock.","badgeLabel":"Zał. w Lublinie","startedOverline":"Jak to się","startedTitle":"Zaczęło","startedP1":"Impulsem do założenia fundacji charytatywnej był nagły napływ ogromnej liczby uchodźców z Ukrainy po ataku Rosji 24 lutego 2022 roku. Świadomi przewidywanego, długotrwałego konfliktu, postanowiliśmy powołać fundację wspierającą uchodźców, szczególnie w Lublinie — ze względu na bliskość granicy z Ukrainą.","startedP2":"Od początku wojny Lublin był jednym z głównych punktów recepcyjnych dla uchodźców z Ukrainy i stał się jednym z największych skupisk uchodźczych w Polsce. Przyjął ponad milion osób, a około 60 tysięcy zostało w Lublinie na stałe.","startedP3":"Od momentu powstania Fundacja Stock koncentrowała się na łagodzeniu kryzysu — pomagając szkołom przyjmującym dzieci uchodźcze, oferując wsparcie psychologiczne osobom dotkniętym traumą konfliktu i ułatwiając znalezienie zatrudnienia.","souOverline":"Spirit of Ukraine","souTitle":"Kluczowe inicjatywy dla uchodźców","awardOverline":"Wyróżnienie","awardTitle":"Medal \"Lublin Bohaterom\"","awardText":"W 2023 roku Prezydent Miasta Lublin dr Krzysztof Żuk uhonorował Fundację Stock Medalem „Lublin Bohaterom” za działalność w czasie kryzysu humanitarnego.","awardQuote":"„Dla uhonorowania wielkich czynów oraz zasług w służbie ofiarom kryzysu humanitarnego, z wyrazami szczególnego uznania za strategiczne wsparcie Miasta Lublin w niesieniu pomocy Narodowi Ukraińskiemu oraz wkład w propagowanie szlachetnych wartości.”","awardSrc":"— Prezydent Miasta Lublin dr Krzysztof Żuk · Lublin, 2023","souLead":"Aby realizować swoje cele, Fundacja uruchomiła w Lublinie program „Spirit of Ukraine\" — wielowymiarowe wsparcie pomagające uchodźcom odnaleźć bezpieczeństwo, pracę i wspólnotę.","sou1T":"Wsparcie psychologiczne","sou1X":"Terapie prowadzone przez wykwalifikowanych psychologów — wsparcie emocjonalne i narzędzia radzenia sobie z traumą wojny, w bezpiecznej przestrzeni otwartej rozmowy.","sou2T":"Integracyjne targi pracy","sou2X":"Regularne spotkania dla uchodźców — możliwość kontaktu z pracodawcami i pomoc w sprawach imigracyjnych, platforma wymiany doświadczeń.","sou3T":"Stypendia muzyczne","sou3X":"Finansowanie edukacji muzycznej utalentowanych ukraińskich dzieci oraz wsparcie nauczycieli muzyki w utrzymaniu umiejętności i aktywizacji zawodowej.","sou4T":"Szkolenia zawodowe","sou4X":"Programy szkoleń biurowych dla uchodźców, zwiększające ich szanse na zatrudnienie i samodzielność.","sou5T":"Wsparcie dla szkół","sou5X":"Darowizny sprzętu i materiałów dla szkół, wspierające integrację dzieci uchodźczych ze społecznością szkolną.","sou6T":"Kursy języka polskiego","sou6X":"Kursy językowe dla uchodźców, pomagające w integracji i rozwijaniu umiejętności komunikacyjnych.","evoOverline":"Jak się","evoTitle":"Rozwijamy","evoLead":"Od początku zakładano, że gdy kryzys uchodźczy osłabnie, Fundacja Stock stanie się platformą ważnych projektów społecznych — angażującą pracowników i wolontariuszy. Dziś nasza praca koncentruje się na dostępności kultury i sztuki, przeciwdziałaniu izolacji społecznej i wzmacnianiu lokalnych społeczności.","tl1When":"2022 — Założenie","tl1T":"Pomoc doraźna dla uchodźców","tl1X":"Fundacja powstaje w Lublinie w pierwszych tygodniach wojny i uruchamia program „Spirit of Ukraine\".","tl2When":"2023–2024 — Rozwój","tl2T":"Promocja sztuki i kultury","tl2X":"Działania na rzecz sztuki i kultury: kampanie społeczne, programy edukacyjne, wsparcie artystów i instytucji kultury.","ev1T":"Promocja sztuki i kultury","ev1X":"Zobowiązanie do działania na rzecz sztuki i kultury — poprzez kampanie społeczne, programy edukacyjne i wsparcie artystów oraz instytucji kultury. Zobacz, jak grant Flavours of Change odmienił przedszkole w Šišan w Chorwacji.","ev2T":"Sztuka a zdrowie psychiczne","ev2X":"Uznanie pozytywnego wpływu sztuki na zdrowie psychiczne — kontynuacja pierwszych inicjatyw fundacji, dbanie o dobrostan emocjonalny poprzez wzbogacające kulturalnie działania i doświadczenia.","ev3T":"Twórcze i wspólne działania","ev3X":"Zachęcanie ludzi do wspólnego spędzania czasu i odkrywania nowych form aktywności — wydarzenia, warsztaty i inicjatywy rozwijające kreatywność i relacje, motywujące do wyjścia ze strefy komfortu.","tl3When":"Dziś","tl3T":"Sztuka, zdrowie psychiczne i wspólnota","tl3X":"Spotkania ze Sztuką, stypendia i wspólne działania twórcze wspierające zdrowie psychiczne i łączące ludzi — ponad pokoleniami.","ctaTitle":"Zobacz, co robimy właśnie teraz","ctaNews":"Nasze ostatnie akcje","photoFestynAlt":"Festyn społecznościowy dla rodzin z Ukrainy zorganizowany przez Fundację Stock","photoArtAlt":"Spotkanie ze Sztuką zorganizowane przez fundację","awardMedalAlt":"Medal „Lublin Bohaterom” przyznany fundacji","awardDiplomaAlt":"Dyplom towarzyszący medalowi „Lublin Bohaterom” dla Fundacji Stock"},"cz":{"pageTitle":"O nás","pageLead":"Od nouzové pomoci uprchlíkům k trvalé platformě sociálních a kulturních projektů — příběh Nadace Stock.","badgeLabel":"Zal. v Lublinu","startedOverline":"Jak to","startedTitle":"Začalo","startedP1":"Impulsem k založení charitativní nadace byl náhlý příliv obrovského počtu uprchlíků z Ukrajiny po ruském útoku 24. února 2022. S vědomím očekávaného dlouhotrvajícího konfliktu jsme se rozhodli založit nadaci na podporu ukrajinských uprchlíků, zejména v Lublinu — kvůli blízkosti ukrajinské hranice.","startedP2":"Od začátku války byl Lublin jedním z hlavních přijímacích míst pro ukrajinské uprchlíky a stal se jedním z největších uprchlických center v Polsku. Přijal více než milion lidí a přibližně 60 tisíc jich v Lublinu zůstalo natrvalo.","startedP3":"Od svého vzniku se Nadace Stock soustředila na zmírňování krize — pomocí školám přijímajícím uprchlické děti, psychologickou podporou lidem traumatizovaným konfliktem a usnadňováním pracovních příležitostí.","souOverline":"Spirit of Ukraine","souTitle":"Klíčové iniciativy pro uprchlíky","awardOverline":"Ocenění","awardTitle":"Medaile „Lublin Bohaterom“","awardText":"V roce 2023 udělil primátor Lublinu dr. Krzysztof Żuk Nadaci Stock medaili „Lublin Bohaterom“ (Lublin svým hrdinům) za činnost během humanitární krize.","awardQuote":"„Na počest velkých činů a zásluh ve službě obětem humanitární krize, se zvláštním uznáním za strategickou podporu města Lublin při pomoci ukrajinskému národu a za přínos k šíření ušlechtilých hodnot.“","awardSrc":"— primátor Lublinu dr. Krzysztof Żuk · Lublin, 2023","souLead":"K naplnění svých cílů nadace spustila v Lublinu program „Spirit of Ukraine\" — mnohostrannou podporu pomáhající uprchlíkům najít bezpečí, práci a komunitu.","sou1T":"Psychologická podpora","sou1X":"Terapie vedené kvalifikovanými psychology — emoční podpora a nástroje ke zvládání válečného traumatu v bezpečném prostoru otevřené komunikace.","sou2T":"Integrační veletrhy práce","sou2X":"Pravidelná setkání pro uprchlíky — kontakt se zaměstnavateli a pomoc s imigračními záležitostmi, platforma pro sdílení zkušeností.","sou3T":"Hudební stipendia","sou3X":"Financování hudebního vzdělání talentovaných ukrajinských dětí a podpora učitelů hudby v udržení dovedností a kariéře.","sou4T":"Odborná školení","sou4X":"Kancelářské vzdělávací programy pro uprchlíky zvyšující jejich zaměstnatelnost a samostatnost.","sou5T":"Podpora škol","sou5X":"Dary vybavení a materiálů školám, podporující integraci uprchlických dětí do školní komunity.","sou6T":"Kurzy polštiny","sou6X":"Jazykové kurzy pro uprchlíky, pomáhající s integrací a rozvojem komunikačních dovedností.","evoOverline":"Jak se","evoTitle":"Vyvíjíme","evoLead":"Od začátku se počítalo s tím, že až uprchlická krize odezní, stane se Nadace Stock platformou důležitých sociálních projektů — zapojující zaměstnance a dobrovolníky. Dnes se naše práce soustředí na dostupnost kultury a umění, boj se sociální izolací a posilování místních komunit.","tl1When":"2022 — Založení","tl1T":"Nouzová pomoc uprchlíkům","tl1X":"Nadace vzniká v Lublinu v prvních týdnech války a spouští program „Spirit of Ukraine\".","tl2When":"2023–2024 — Růst","tl2T":"Podpora umění a kultury","tl2X":"Prosazování umění a kultury: osvětové kampaně, vzdělávací programy, podpora umělců a kulturních institucí.","ev1T":"Podpora umění a kultury","ev1X":"Závazek prosazovat umění a kulturu — prostřednictvím osvětových kampaní, vzdělávacích programů a podpory umělců a kulturních institucí. Podívejte se, jak grant Flavours of Change proměnil školku v chorvatském Šišanu.","ev2T":"Umění a duševní zdraví","ev2X":"Uznání pozitivního vlivu umění na duševní zdraví — návaznost na první iniciativy nadace, péče o duševní pohodu skrze kulturně obohacující aktivity a zážitky.","ev3T":"Tvořivé a společné aktivity","ev3X":"Povzbuzování lidí ke společně strávenému času a objevování nových forem aktivit — akce, dílny a iniciativy rozvíjející kreativitu a vztahy, motivující vyjít z komfortní zóny.","tl3When":"Dnes","tl3T":"Umění, duševní zdraví a komunita","tl3X":"Setkání s uměním, stipendia a společné tvořivé aktivity podporující duševní zdraví a spojující lidi — napříč generacemi.","ctaTitle":"Podívejte se, co právě děláme","ctaNews":"Naše poslední akce","photoFestynAlt":"Komunitní slavnost pro ukrajinské rodiny pořádaná Nadací Stock","photoArtAlt":"Setkání s uměním pořádané nadací","awardMedalAlt":"Medaile „Lublin Bohaterom“ udělená nadaci","awardDiplomaAlt":"Diplom doprovázející medaili „Lublin Bohaterom“ pro Nadaci Stock"},"it":{"pageTitle":"Chi siamo","pageLead":"Dall’aiuto d’emergenza per i rifugiati a una piattaforma duratura di progetti sociali e culturali — la storia della Fondazione Stock.","badgeLabel":"Fond. a Lublino","startedOverline":"Come è","startedTitle":"Iniziato","startedP1":"L’impulso a creare una fondazione benefica è venuto dall’improvviso afflusso di un enorme numero di rifugiati dall’Ucraina, innescato dall’attacco russo del 24 febbraio 2022. Consapevoli del previsto conflitto di lunga durata, abbiamo deciso di fondare una fondazione per sostenere i rifugiati ucraini, in particolare a Lublino, per la sua vicinanza al confine ucraino.","startedP2":"Dall’inizio della guerra, la città di Lublino è stata uno dei principali punti di accoglienza per i rifugiati ucraini e uno dei maggiori centri di rifugiati in Polonia. Ha accolto oltre un milione di persone e circa 60 mila sono rimaste stabilmente a Lublino.","startedP3":"Fin dalla nascita, la Fondazione Stock si è concentrata sull’attenuazione della crisi — aiutando le scuole che accolgono bambini rifugiati, offrendo sostegno psicologico alle persone traumatizzate dal conflitto e facilitando le opportunità di lavoro.","souOverline":"Spirit of Ukraine","souTitle":"Le iniziative chiave per i rifugiati","awardOverline":"Riconoscimento","awardTitle":"Medaglia „Lublin Bohaterom”","awardText":"Nel 2023 il Sindaco di Lublino, dott. Krzysztof Żuk, ha conferito alla Fondazione Stock la Medaglia „Lublin Bohaterom” (Lublino ai suoi eroi) per il lavoro svolto durante la crisi umanitaria.","awardQuote":"“In onore delle grandi azioni e dei meriti al servizio delle vittime della crisi umanitaria, con particolare riconoscimento per il sostegno strategico alla Città di Lublino nell’aiuto alla Nazione Ucraina e per il contributo alla promozione di nobili valori.”","awardSrc":"— Sindaco di Lublino dott. Krzysztof Żuk · Lublino, 2023","souLead":"Per raggiungere i suoi obiettivi, la Fondazione ha lanciato a Lublino il programma \"Spirit of Ukraine\" — un approccio multiforme per aiutare i rifugiati a trovare sicurezza, lavoro e comunità.","sou1T":"Sostegno psicologico","sou1X":"Terapie condotte da psicologi qualificati — sostegno emotivo e strumenti per affrontare il trauma della guerra, in uno spazio sicuro di comunicazione aperta.","sou2T":"Fiere del lavoro integrative","sou2X":"Incontri regolari per i rifugiati — contatti con i datori di lavoro e aiuto con le questioni migratorie, una piattaforma per condividere esperienze.","sou3T":"Borse di studio musicali","sou3X":"Finanziamento dell’educazione musicale di bambini ucraini di talento e sostegno agli insegnanti di musica nelle loro carriere.","sou4T":"Formazione professionale","sou4X":"Programmi di formazione d’ufficio per i rifugiati, che aumentano occupabilità e indipendenza.","sou5T":"Sostegno alle scuole","sou5X":"Donazioni di attrezzature e materiali alle scuole, a sostegno dell’integrazione dei bambini rifugiati nella comunità scolastica.","sou6T":"Corsi di lingua polacca","sou6X":"Corsi di lingua per i rifugiati, che aiutano l’integrazione e le capacità comunicative.","evoOverline":"Come ci","evoTitle":"Evolviamo","evoLead":"Fin dall’inizio si prevedeva che, attenuandosi la crisi dei rifugiati, la Fondazione Stock sarebbe diventata una piattaforma per importanti progetti sociali — coinvolgendo dipendenti e volontari. Oggi il nostro lavoro ruota attorno all’accessibilità della cultura e dell’arte, al contrasto dell’isolamento sociale e al rafforzamento delle comunità locali.","tl1When":"2022 — Fondazione","tl1T":"Aiuto d’emergenza ai rifugiati","tl1X":"La fondazione nasce a Lublino nelle prime settimane della guerra e lancia il programma \"Spirit of Ukraine\".","tl2When":"2023–2024 — Crescita","tl2T":"Promozione di arte e cultura","tl2X":"Sostegno ad arte e cultura: campagne di sensibilizzazione, programmi educativi, supporto ad artisti e istituzioni culturali.","ev1T":"Promozione delle arti e della cultura","ev1X":"Un impegno a sostenere le arti e la cultura — attraverso campagne di sensibilizzazione, programmi educativi e supporto ad artisti e istituzioni culturali. Scopri come una borsa Flavours of Change ha trasformato un asilo a Šišan, in Croazia.","ev2T":"Arte e salute mentale","ev2X":"Il riconoscimento dell’influenza positiva dell’arte sulla salute mentale — in continuità con le prime iniziative della fondazione, prendendosi cura del benessere emotivo con attività culturalmente arricchenti.","ev3T":"Attività creative e collettive","ev3X":"Incoraggiare le persone a passare del tempo insieme e a esplorare nuovi modi per farlo — eventi, laboratori e iniziative che stimolano creatività e relazioni, motivando a uscire dalla propria zona di comfort.","tl3When":"Oggi","tl3T":"Arte, salute mentale e comunità","tl3X":"Incontri con l’Arte, borse di studio e attività creative collettive che sostengono la salute mentale e uniscono le persone — attraverso le generazioni.","ctaTitle":"Guarda cosa stiamo facendo proprio ora","ctaNews":"Le nostre ultime azioni","photoFestynAlt":"Festa comunitaria per le famiglie ucraine organizzata dalla Fondazione Stock","photoArtAlt":"Un Incontro con l’Arte organizzato dalla fondazione","awardMedalAlt":"La medaglia «Lublin Bohaterom» conferita alla fondazione","awardDiplomaAlt":"Diploma che accompagna la medaglia «Lublin Bohaterom» per la Fondazione Stock"},"sk":{"pageTitle":"O nás","pageLead":"Od okamžitej pomoci utečencom k trvalej platforme sociálnych a kultúrnych projektov — príbeh Nadácie Stock.","badgeLabel":"Zal. v Lubline","startedOverline":"Začiatky","startedTitle":"Ako sa to začalo","startedP1":"Impulzom na založenie charitatívnej nadácie bol náhly prílev obrovského počtu utečencov z Ukrajiny po ruskom útoku 24. februára 2022. S vedomím očakávaného dlhotrvajúceho konfliktu sme sa rozhodli založiť nadáciu na podporu ukrajinských utečencov, najmä v Lubline — pre jeho blízkosť k ukrajinskej hranici.","startedP2":"Od začiatku vojny bol Lublin jedným z hlavných prijímacích miest pre utečencov z Ukrajiny a stal sa jedným z najväčších utečeneckých centier v Poľsku. Prijal vyše milióna ľudí a približne 60-tisíc z nich zostalo v Lubline natrvalo.","startedP3":"Od svojho vzniku sa Nadácia Stock sústredila na zmierňovanie krízy — pomáhala školám prijímajúcim utečenecké deti, ponúkala psychologickú podporu ľuďom traumatizovaným konfliktom a uľahčovala hľadanie zamestnania.","souOverline":"Spirit of Ukraine","souTitle":"Kľúčové iniciatívy pre utečencov","awardOverline":"Ocenenie","awardTitle":"Medaila „Lublin Bohaterom“","awardText":"V roku 2023 udelil primátor Lublina dr. Krzysztof Żuk Nadácii Stock medailu „Lublin Bohaterom“ (Lublin svojim hrdinom) za činnosť počas humanitárnej krízy.","awardQuote":"„Na počesť veľkých činov a zásluh v službe obetiam humanitárnej krízy, s výrazom osobitného uznania za strategickú podporu mesta Lublin pri pomoci ukrajinskému národu a za prínos k šíreniu ušľachtilých hodnôt.“","awardSrc":"— primátor Lublina dr. Krzysztof Żuk · Lublin, 2023","souLead":"Na naplnenie svojich cieľov nadácia spustila v Lubline program „Spirit of Ukraine“ — mnohostrannú podporu, ktorá pomáha utečencom nájsť bezpečie, prácu a spoločenstvo.","sou1T":"Psychologická podpora","sou1X":"Terapie vedené kvalifikovanými psychológmi — emocionálna podpora a nástroje na zvládanie vojnovej traumy v bezpečnom priestore otvorenej komunikácie.","sou2T":"Integračné veľtrhy práce","sou2X":"Pravidelné stretnutia pre utečencov — kontakt so zamestnávateľmi a pomoc s imigračnými záležitosťami, platforma na výmenu skúseností.","sou3T":"Hudobné štipendiá","sou3X":"Financovanie hudobného vzdelávania talentovaných ukrajinských detí a podpora učiteľov hudby pri udržiavaní zručností a profesijnom uplatnení.","sou4T":"Odborné školenia","sou4X":"Programy kancelárskych školení pre utečencov, ktoré zvyšujú ich šance na zamestnanie a samostatnosť.","sou5T":"Podpora škôl","sou5X":"Dary vybavenia a materiálov školám na podporu integrácie utečeneckých detí do školskej komunity.","sou6T":"Kurzy poľštiny","sou6X":"Jazykové kurzy pre utečencov, ktoré pomáhajú pri integrácii a rozvoji komunikačných zručností.","evoOverline":"Náš rozvoj","evoTitle":"Ako sa rozvíjame","evoLead":"Od začiatku sa počítalo s tým, že keď utečenecká kríza opadne, Nadácia Stock sa stane platformou dôležitých sociálnych projektov — zapájajúcou zamestnancov a dobrovoľníkov. Dnes sa naša práca sústreďuje na dostupnosť kultúry a umenia, boj proti sociálnej izolácii a posilňovanie miestnych komunít.","tl1When":"2022 — Založenie","tl1T":"Okamžitá pomoc utečencom","tl1X":"Nadácia vzniká v Lubline v prvých týždňoch vojny a spúšťa program „Spirit of Ukraine“.","tl2When":"2023–2024 — Rast","tl2T":"Podpora umenia a kultúry","tl2X":"Aktivity v prospech umenia a kultúry: osvetové kampane, vzdelávacie programy, podpora umelcov a kultúrnych inštitúcií.","ev1T":"Podpora umenia a kultúry","ev1X":"Záväzok konať v prospech umenia a kultúry — prostredníctvom osvetových kampaní, vzdelávacích programov a podpory umelcov a kultúrnych inštitúcií. Pozrite sa, ako grant Flavours of Change premenil škôlku v chorvátskom Šišane.","ev2T":"Umenie a duševné zdravie","ev2X":"Uznanie pozitívneho vplyvu umenia na duševné zdravie — pokračovanie prvých iniciatív nadácie, starostlivosť o emocionálnu pohodu prostredníctvom kultúrne obohacujúcich aktivít a zážitkov.","ev3T":"Tvorivé a spoločné aktivity","ev3X":"Povzbudzovanie ľudí k spoločne strávenému času a objavovaniu nových foriem aktivít — podujatia, workshopy a iniciatívy rozvíjajúce kreativitu a vzťahy, motivujúce vykročiť z komfortnej zóny.","tl3When":"Dnes","tl3T":"Umenie, duševné zdravie a spoločenstvo","tl3X":"Stretnutia s umením, štipendiá a spoločné tvorivé aktivity, ktoré podporujú duševné zdravie a spájajú ľudí — naprieč generáciami.","ctaTitle":"Pozrite sa, čo robíme práve teraz","ctaNews":"Naše najnovšie akcie","photoFestynAlt":"Komunitná slávnosť pre ukrajinské rodiny organizovaná Nadáciou Stock","photoArtAlt":"Stretnutie s umením organizované nadáciou","awardMedalAlt":"Medaila „Lublin Bohaterom“ udelená nadácii","awardDiplomaAlt":"Diplom sprevádzajúci medailu „Lublin Bohaterom“ pre Nadáciu Stock"},"de":{"pageTitle":"Über uns","pageLead":"Von der Nothilfe für Geflüchtete zu einer dauerhaften Plattform für soziale und kulturelle Projekte — die Geschichte der Stiftung Stock.","badgeLabel":"Gegr. in Lublin","startedOverline":"Der Anfang","startedTitle":"Wie alles begann","startedP1":"Der Anstoß zur Gründung einer wohltätigen Stiftung war der plötzliche Zustrom einer enormen Zahl von Geflüchteten aus der Ukraine nach dem russischen Angriff am 24. Februar 2022. Im Bewusstsein des absehbar langwierigen Konflikts beschlossen wir, eine Stiftung zur Unterstützung der Geflüchteten zu gründen — insbesondere in Lublin, wegen der Nähe zur ukrainischen Grenze.","startedP2":"Seit Kriegsbeginn war Lublin eine der wichtigsten Anlaufstellen für Geflüchtete aus der Ukraine und wurde zu einem der größten Zufluchtsorte in Polen. Die Stadt nahm über eine Million Menschen auf, und etwa 60.000 blieben dauerhaft in Lublin.","startedP3":"Von Anfang an konzentrierte sich die Stiftung Stock auf die Linderung der Krise — sie half Schulen, die geflüchtete Kinder aufnahmen, bot vom Konflikt traumatisierten Menschen psychologische Unterstützung und erleichterte die Arbeitssuche.","souOverline":"Spirit of Ukraine","souTitle":"Zentrale Initiativen für Geflüchtete","awardOverline":"Auszeichnung","awardTitle":"Medaille „Lublin Bohaterom“","awardText":"Im Jahr 2023 ehrte der Stadtpräsident von Lublin, Dr. Krzysztof Żuk, die Stiftung Stock mit der Medaille „Lublin Bohaterom“ (Lublin seinen Helden) für ihr Engagement während der humanitären Krise.","awardQuote":"„Zu Ehren großer Taten und Verdienste im Dienst an den Opfern der humanitären Krise, mit besonderer Anerkennung für die strategische Unterstützung der Stadt Lublin bei der Hilfe für das ukrainische Volk und für den Beitrag zur Förderung edler Werte.“","awardSrc":"— Stadtpräsident von Lublin Dr. Krzysztof Żuk · Lublin, 2023","souLead":"Zur Verwirklichung ihrer Ziele startete die Stiftung in Lublin das Programm „Spirit of Ukraine“ — eine vielseitige Unterstützung, die Geflüchteten hilft, Sicherheit, Arbeit und Gemeinschaft zu finden.","sou1T":"Psychologische Unterstützung","sou1X":"Therapien unter Leitung qualifizierter Psychologinnen und Psychologen — emotionale Unterstützung und Werkzeuge zur Bewältigung des Kriegstraumas, in einem sicheren Raum für offene Gespräche.","sou2T":"Integrative Jobmessen","sou2X":"Regelmäßige Treffen für Geflüchtete — Kontakt zu Arbeitgebern und Hilfe bei Einwanderungsfragen, eine Plattform zum Erfahrungsaustausch.","sou3T":"Musikstipendien","sou3X":"Finanzierung der musikalischen Ausbildung talentierter ukrainischer Kinder sowie Unterstützung von Musiklehrkräften beim Erhalt ihrer Fähigkeiten und in ihrer beruflichen Tätigkeit.","sou4T":"Berufliche Schulungen","sou4X":"Büroschulungsprogramme für Geflüchtete, die ihre Beschäftigungschancen und Selbstständigkeit erhöhen.","sou5T":"Unterstützung für Schulen","sou5X":"Spenden von Ausstattung und Materialien an Schulen zur Förderung der Integration geflüchteter Kinder in die Schulgemeinschaft.","sou6T":"Polnisch-Sprachkurse","sou6X":"Sprachkurse für Geflüchtete, die bei der Integration helfen und die Kommunikationsfähigkeiten stärken.","evoOverline":"Unsere Entwicklung","evoTitle":"Wie wir uns entwickeln","evoLead":"Von Anfang an war vorgesehen, dass die Stiftung Stock mit dem Abklingen der Flüchtlingskrise zu einer Plattform für wichtige soziale Projekte wird — die Mitarbeitende einbindet und Freiwillige gewinnt. Heute konzentriert sich unsere Arbeit auf den Zugang zu Kultur und Kunst, den Kampf gegen soziale Isolation und die Stärkung lokaler Gemeinschaften.","tl1When":"2022 — Gründung","tl1T":"Nothilfe für Geflüchtete","tl1X":"Die Stiftung entsteht in Lublin in den ersten Kriegswochen und startet das Programm „Spirit of Ukraine“.","tl2When":"2023–2024 — Wachstum","tl2T":"Förderung von Kunst und Kultur","tl2X":"Engagement für Kunst und Kultur: Aufklärungskampagnen, Bildungsprogramme, Unterstützung von Kunstschaffenden und Kulturinstitutionen.","ev1T":"Förderung von Kunst und Kultur","ev1X":"Ein Engagement für Kunst und Kultur — durch Aufklärungskampagnen, Bildungsprogramme und die Unterstützung von Kunstschaffenden und Kulturinstitutionen. Sehen Sie, wie eine Flavours-of-Change-Förderung einen Kindergarten im kroatischen Šišan verwandelt hat.","ev2T":"Kunst und psychische Gesundheit","ev2X":"Die Anerkennung des positiven Einflusses der Kunst auf die psychische Gesundheit — in Kontinuität mit den ersten Initiativen der Stiftung, mit Sorge um das emotionale Wohlbefinden durch kulturell bereichernde Aktivitäten und Erlebnisse.","ev3T":"Kreative und gemeinschaftliche Aktivitäten","ev3X":"Menschen ermutigen, Zeit miteinander zu verbringen und neue Formen der Aktivität zu entdecken — Veranstaltungen, Workshops und Initiativen, die Kreativität und Beziehungen fördern und dazu motivieren, die Komfortzone zu verlassen.","tl3When":"Heute","tl3T":"Kunst, psychische Gesundheit und Gemeinschaft","tl3X":"Kunstbegegnungen, Stipendien und gemeinsame kreative Aktivitäten, die die psychische Gesundheit stärken und Menschen verbinden — über Generationen hinweg.","ctaTitle":"Sehen Sie, was wir gerade jetzt tun","ctaNews":"Unsere neuesten Aktionen","photoFestynAlt":"Gemeinschaftsfest für ukrainische Familien, organisiert von der Stiftung Stock","photoArtAlt":"Eine von der Stiftung organisierte Kunstbegegnung","awardMedalAlt":"Die der Stiftung verliehene Medaille „Lublin Bohaterom“","awardDiplomaAlt":"Urkunde zur Medaille „Lublin Bohaterom“ für die Stiftung Stock"},"fr":{"pageTitle":"À propos","pageLead":"De l’aide d’urgence aux réfugiés à une plateforme durable de projets sociaux et culturels — l’histoire de la Fondation Stock.","badgeLabel":"Fondée à Lublin","startedOverline":"Les débuts","startedTitle":"Comment tout a commencé","startedP1":"L’impulsion pour créer une fondation caritative est venue de l’afflux soudain d’un très grand nombre de réfugiés d’Ukraine après l’attaque russe du 24 février 2022. Conscients du conflit de longue durée qui s’annonçait, nous avons décidé de créer une fondation pour soutenir les réfugiés, en particulier à Lublin — en raison de sa proximité avec la frontière ukrainienne.","startedP2":"Depuis le début de la guerre, Lublin a été l’un des principaux points d’accueil des réfugiés d’Ukraine et est devenu l’une des plus grandes concentrations de réfugiés en Pologne. La ville a accueilli plus d’un million de personnes, dont environ 60 000 sont restées à Lublin de façon permanente.","startedP3":"Dès sa création, la Fondation Stock s’est concentrée sur l’atténuation de la crise — en aidant les écoles accueillant des enfants réfugiés, en offrant un soutien psychologique aux personnes traumatisées par le conflit et en facilitant l’accès à l’emploi.","souOverline":"Spirit of Ukraine","souTitle":"Nos initiatives clés pour les réfugiés","awardOverline":"Distinction","awardTitle":"Médaille « Lublin Bohaterom »","awardText":"En 2023, le maire de Lublin, le Dr Krzysztof Żuk, a honoré la Fondation Stock de la médaille « Lublin Bohaterom » (Lublin à ses héros) pour son action pendant la crise humanitaire.","awardQuote":"« En l’honneur des grandes actions et des mérites au service des victimes de la crise humanitaire, avec une reconnaissance particulière pour le soutien stratégique apporté à la Ville de Lublin dans l’aide à la Nation ukrainienne et pour la contribution à la promotion de nobles valeurs. »","awardSrc":"— Le maire de Lublin, le Dr Krzysztof Żuk · Lublin, 2023","souLead":"Pour atteindre ses objectifs, la Fondation a lancé à Lublin le programme « Spirit of Ukraine » — un soutien à multiples facettes qui aide les réfugiés à trouver sécurité, travail et communauté.","sou1T":"Soutien psychologique","sou1X":"Des thérapies menées par des psychologues qualifiés — un soutien émotionnel et des outils pour faire face au traumatisme de la guerre, dans un espace sûr de parole ouverte.","sou2T":"Salons de l’emploi et de l’intégration","sou2X":"Des rencontres régulières pour les réfugiés — la possibilité d’entrer en contact avec des employeurs et une aide pour les questions d’immigration, une plateforme d’échange d’expériences.","sou3T":"Bourses musicales","sou3X":"Le financement de l’éducation musicale d’enfants ukrainiens talentueux et le soutien aux professeurs de musique dans le maintien de leurs compétences et leur activité professionnelle.","sou4T":"Formations professionnelles","sou4X":"Des programmes de formation aux métiers de bureau pour les réfugiés, augmentant leur employabilité et leur autonomie.","sou5T":"Soutien aux écoles","sou5X":"Des dons d’équipements et de matériel aux écoles, pour favoriser l’intégration des enfants réfugiés dans la communauté scolaire.","sou6T":"Cours de polonais","sou6X":"Des cours de langue pour les réfugiés, qui facilitent l’intégration et développent les compétences de communication.","evoOverline":"Notre évolution","evoTitle":"Comment nous évoluons","evoLead":"Dès le départ, il était prévu qu’une fois la crise des réfugiés apaisée, la Fondation Stock devienne une plateforme de projets sociaux importants — impliquant les salariés et mobilisant des bénévoles. Aujourd’hui, notre travail se concentre sur l’accessibilité de la culture et de l’art, la lutte contre l’isolement social et le renforcement des communautés locales.","tl1When":"2022 — Création","tl1T":"Aide d’urgence aux réfugiés","tl1X":"La fondation voit le jour à Lublin dans les premières semaines de la guerre et lance le programme « Spirit of Ukraine ».","tl2When":"2023–2024 — Croissance","tl2T":"Promotion des arts et de la culture","tl2X":"Un engagement pour les arts et la culture : campagnes de sensibilisation, programmes éducatifs, soutien aux artistes et aux institutions culturelles.","ev1T":"Promotion des arts et de la culture","ev1X":"Un engagement à défendre les arts et la culture — à travers des campagnes de sensibilisation, des programmes éducatifs et le soutien aux artistes et aux institutions culturelles. Découvrez comment une subvention Flavours of Change a transformé une école maternelle à Šišan, en Croatie.","ev2T":"L’art et la santé mentale","ev2X":"La reconnaissance de l’influence positive de l’art sur la santé mentale — dans la continuité des premières initiatives de la fondation, en prenant soin du bien-être émotionnel à travers des activités et des expériences culturellement enrichissantes.","ev3T":"Activités créatives et collectives","ev3X":"Encourager les gens à passer du temps ensemble et à explorer de nouvelles façons de le faire — des événements, des ateliers et des initiatives qui stimulent la créativité et les liens, et motivent à sortir de sa zone de confort.","tl3When":"Aujourd’hui","tl3T":"Art, santé mentale et communauté","tl3X":"Les Rencontres avec l’art, les bourses d’études et les activités créatives collectives qui soutiennent la santé mentale et rassemblent les gens — au-delà des générations.","ctaTitle":"Découvrez ce que nous faisons en ce moment","ctaNews":"Nos dernières actions","photoFestynAlt":"Fête communautaire pour les familles ukrainiennes organisée par la Fondation Stock","photoArtAlt":"Une Rencontre avec l’art organisée par la fondation","awardMedalAlt":"La médaille « Lublin Bohaterom » décernée à la fondation","awardDiplomaAlt":"Diplôme accompagnant la médaille « Lublin Bohaterom » pour la Fondation Stock"}}/* /CONTENT */;
