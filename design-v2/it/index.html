jemy","initTitle":"Kluczowe inicjatywy","init1Title":"Pomoc uchodźcom","init1Text":"Program „Spirit of Ukraine\": wsparcie psychologiczne, spotkania z pracodawcami, szkolenia zawodowe, kursy języka polskiego i darowizny dla szkół przyjmujących dzieci uchodźcze.","init2Title":"Sztuka jako terapia","init2Text":"Organizujemy spotkania ze sztuką dla seniorów w Lublinie — z kustoszami muzeów — a także stypendia muzyczne i warsztaty twórcze dla osób zmagających się z samotnością, depresją lub brakiem inspiracji.","init3Title":"Integracja społeczności","init3Text":"Łączymy nowo przybyłych i mieszkańców wokół wspólnych projektów — kultury, edukacji i wolontariatu — aby pomoc stawała się przyjaźnią.","startedOverline":"Początki","startedTitle":"Jak to się zaczęło","startedText":"Fundacja powstała w 2022 roku, w pierwszych tygodniach wojny w Ukrainie, gdy Lublin — położony blisko granicy — przyjął falę ponad miliona uchodźców. To, co zaczęło się jako pomoc doraźna, stało się trwałym zobowiązaniem: dziś fundacja realizuje projekty społeczne i kulturalne, angażując pracowników i wolontariuszy.","statuteOverline":"Przejrzystość","statuteTitle":"Statut i sprawozdania roczne","statuteText":"Wierzymy, że zaufanie buduje się otwartością. Nasz statut, sprawozdania finansowe i roczne raporty z działalności są publiczne — sprawdź, jak wykorzystujemy każdą darowiznę.","statuteLink1":"Statut fundacji (PDF)","statuteLink2":"Wszystkie sprawozdania","latestLabel":"Najnowsze","newestLabel":"Najnowsze","cadenceNote":"Nowe akcje i wpisy dodajemy na bieżąco","news1Alt":"Spotkanie ze Sztuką dla seniorów w Lublinie — prelekcja w DPS przy ul. Ametystowej","news2Alt":"Szkolenie dla pracowników socjalnych MOPR w Lublinie","news3Alt":"Stypendysta fundacji na Mistrzostwach Europy Taekwon-Do"},"cz":{"heroTitle1":"Naděje, umění","heroTitle2":"a komunita","heroEst":"zal. 2022","heroTagline":"Stojíme při uprchlících a komunitách zasažených válkou a věříme v tichou sílu umění, které léčí samotu, depresi a ztracenou inspiraci.","heroCta":"Poznejte nadaci","stat1":"založena v Lublinu","stat2":"pomocných programů od roku 2022","stat3":"přímých a nepřímých příjemců","stat4":"dobrovolníků v akcích nadace","missionOverline":"Naše mise","missionTitle":"Mise","missionP1":"Nadace Stock podporuje uprchlíky a místní komunity procházející válečnou krizí. Od roku 2022 organizujeme přímou pomoc v Lublinu — jednom z největších přijímacích míst v Polsku — psychologickou podporu, veletrhy práce, stipendia a pomoc školám.","missionP2":"Věříme také, že umění je formou péče. Prostřednictvím Setkání s uměním, workshopů a společné tvorby oslovujeme lidi potýkající se se samotou, depresí nebo nedostatkem inspirace — protože duševní pohoda si zaslouží stejnou pozornost jako materiální potřeby.","missionStat1":"rok založení v Lublinu","missionStat2":"uprchlíků zůstalo v Lublinu natrvalo","newsOverline":"Co právě děláme","newsTitle":"Novinky","newsSeeAll":"Všechny novinky","catArt":"Setkání s uměním","catCommunity":"Komunita","catScholar":"Stipendia","news1Date":"5. června 2026","news1Title":"Obrazy Wojciecha Gersona v domově sociální péče Ametystowa","news1Excerpt":"Kurátorka Jolanta Polańska z Národního muzea v Lublinu vedla další inspirativní Setkání s uměním pro obyvatele domova sociální péče na ulici Ametystowa.","news2Date":"26. května 2026","news2Title":"Podporujeme ty, kdo podporují druhé","news2Excerpt":"Třicet zaměstnanců městských center podpory rodiny (MOPR) v Lublinu dokončilo školení vedené našimi terapeuty o práci s lidmi se závislostmi.","news3Date":"7. května 2026","news3Title":"Hudební a sportovní stipendium — další vítězství","news3Excerpt":"Piotr Pawlik z našeho stipendijního programu získal 3. místo v týmových sestavách juniorů na mistrovství Evropy v Taekwon-Do v Mariboru.","initOverline":"Co děláme","initTitle":"Klíčové iniciativy","init1Title":"Pomoc uprchlíkům","init1Text":"Program „Spirit of Ukraine\": psychologická podpora, setkání se zaměstnavateli, odborná školení, kurzy polštiny a dary školám přijímajícím uprchlické děti.","init2Title":"Umění jako terapie","init2Text":"Setkání s uměním s muzejními kurátory, hudební stipendia a tvořivé dílny pro každého, kdo se potýká se samotou, depresí či nedostatkem inspirace.","init3Title":"Integrace komunity","init3Text":"Spojujeme nově příchozí a místní kolem společných projektů — kultury, vzdělávání a dobrovolnictví — aby se z pomoci stalo přátelství.","startedOverline":"Začátky","startedTitle":"Jak to všechno začalo","startedText":"Nadace vznikla v roce 2022, v prvních týdnech války na Ukrajině, kdy Lublin — ležící blízko hranice — přijal vlnu více než milionu uprchlíků. Co začalo jako nouzová pomoc, se stalo trvalým závazkem: dnes nadace realizuje sociální a kulturní projekty a zapojuje zaměstnance i dobrovolníky.","statuteOverline":"Transparentnost","statuteTitle":"Statut a výroční zprávy","statuteText":"Věříme, že důvěra se získává otevřeností. Náš statut, účetní závěrky i výroční zprávy o činnosti jsou veřejné — přečtěte si, jak je využit každý dar.","statuteLink1":"Statut nadace (PDF)","statuteLink2":"Všechny zprávy","latestLabel":"Nejnovější","newestLabel":"Nejnovější","cadenceNote":"Nové akce a příspěvky přidáváme průběžně","news1Alt":"Setkání s uměním pro seniory v Lublinu — přednáška v domově sociální péče na ulici Ametystowa","news2Alt":"Školení pro sociální pracovníky střediska pomoci rodině v Lublinu","news3Alt":"Stipendista nadace na mistrovství Evropy v Taekwon-Do"},"it":{"heroTitle1":"Speranza, arte","heroTitle2":"e comunità","heroEst":"fond. 2022","heroTagline":"Sosteniamo i rifugiati e le comunità colpite dalla guerra e crediamo nel potere silenzioso dell’arte di curare solitudine, depressione e mancanza di ispirazione.","heroCta":"Scopri chi siamo","stat1":"fondata a Lublino","stat2":"programmi di aiuto dal 2022","stat3":"beneficiari diretti e indiretti","stat4":"volontari nelle nostre iniziative","missionOverline":"La nostra missione","missionTitle":"Missione","missionP1":"La Fondazione Stock sostiene i rifugiati e le comunità locali che vivono la crisi della guerra. Dal 2022 organizziamo aiuti diretti a Lublino — uno dei maggiori punti di accoglienza in Polonia — con sostegno psicologico, fiere del lavoro, borse di studio e aiuti alle scuole.","missionP2":"Crediamo anche che l’arte sia una forma di cura. Con gli Incontri con l’Arte, i laboratori e la creazione condivisa raggiungiamo chi lotta con solitudine, depressione o mancanza di ispirazione — perché il benessere emotivo merita la stessa attenzione dei bisogni materiali.","missionStat1":"fondata a Lublino, Polonia","missionStat2":"rifugiati rimasti stabilmente a Lublino","newsOverline":"Cosa stiamo facendo","newsTitle":"Notizie","newsSeeAll":"Tutte le notizie","catArt":"Incontri con l’arte","catCommunity":"Comunità","catScholar":"Borse di studio","news1Date":"5 giugno 2026","news1Title":"I dipinti di Wojciech Gerson presentati al DPS Ametystowa","news1Excerpt":"La curatrice Jolanta Polańska del Museo Nazionale di Lublino ha guidato un altro ispirante Incontro con l’Arte per i residenti della casa di assistenza sociale di via Ametystowa.","news2Date":"26 maggio 2026","news2Title":"Sosteniamo chi sostiene gli altri","news2Excerpt":"Trenta dipendenti dei centri municipali di sostegno alla famiglia (MOPR) di Lublino hanno completato una formazione condotta dai nostri terapeuti sul lavoro con persone colpite da dipendenze.","news3Date":"7 maggio 2026","news3Title":"Borsa di studio musica e sport — un’altra vittoria","news3Excerpt":"Piotr Pawlik del nostro programma di borse di studio ha vinto il 3° posto nelle forme a squadre junior ai Campionati Europei di Taekwon-Do a Maribor.","initOverline":"Cosa facciamo","initTitle":"Iniziative chiave","init1Title":"Aiuto ai rifugiati","init1Text":"Il programma \"Spirit of Ukraine\": sostegno psicologico, incontri con i datori di lavoro, formazione professionale, corsi di polacco e donazioni alle scuole che accolgono bambini rifugiati.","init2Title":"Arte come terapia","init2Text":"Incontri con l’Arte con curatori museali, borse di studio musicali e laboratori creativi per chi affronta solitudine, depressione o mancanza di ispirazione.","init3Title":"Integrazione della comunità","init3Text":"Uniamo nuovi arrivati e residenti attorno a progetti comuni — cultura, istruzione e volontariato — perché l’aiuto diventi amicizia.","startedOverline":"Gli inizi","startedTitle":"Come tutto è iniziato","startedText":"La fondazione è nata nel 2022, nelle prime settimane della guerra in Ucraina, quando Lublino — vicina al confine — ha accolto un’ondata di oltre un milione di rifugiati. Ciò che è iniziato come aiuto d’emergenza è diventato un impegno duraturo: oggi la fondazione realizza progetti sociali e culturali coinvolgendo dipendenti e volontari.","statuteOverline":"Trasparenza","statuteTitle":"Statuto e rapporti annuali","statuteText":"Crediamo che la fiducia si conquisti con la trasparenza. Il nostro statuto, i bilanci e i rapporti annuali di attività sono pubblici — scopri come viene usata ogni donazione.","statuteLink1":"Statuto della fondazione (PDF)","statuteLink2":"Tutti i rapporti","latestLabel":"Ultima","newestLabel":"Più recente","cadenceNote":"Nuove azioni e storie aggiunte regolarmente","news1Alt":"Incontro con l’Arte per anziani a Lublino — una conferenza nella casa di assistenza sociale di via Ametystowa","news2Alt":"Formazione per gli assistenti sociali del centro di sostegno alla famiglia di Lublino","news3Alt":"Un borsista della fondazione ai Campionati Europei di Taekwon-Do"},"sk":{"heroTitle1":"Nádej, umenie","heroTitle2":"a komunita","heroEst":"zal. 2022","heroTagline":"Podporujeme utečencov a komunity zasiahnuté vojnou. Veríme v tichú silu umenia, ktoré lieči samotu, depresiu a nedostatok inšpirácie.","heroCta":"Spoznajte nadáciu","stat1":"rok založenia v Lubline","stat2":"pomocných programov od roku 2022","stat3":"priamych a nepriamych príjemcov","stat4":"dobrovoľníkov v akciách nadácie","missionOverline":"Naša misia","missionTitle":"Misia","missionP1":"Nadácia Stock podporuje utečencov a miestne komunity prežívajúce vojnovú krízu. Od roku 2022 organizujeme priamu pomoc v Lubline — jednom z najväčších prijímacích miest v Poľsku — psychologickú podporu, veľtrhy práce, štipendiá a pomoc školám.","missionP2":"Veríme tiež, že umenie je formou starostlivosti. Prostredníctvom Stretnutí s umením, workshopov a spoločnej tvorby oslovujeme ľudí, ktorí zápasia so samotou, depresiou alebo nedostatkom inšpirácie — pretože emocionálna pohoda si zaslúži rovnakú pozornosť ako materiálne potreby.","missionStat1":"rok založenia v Lubline","missionStat2":"utečencov zostalo v Lubline natrvalo","newsOverline":"Čo práve robíme","newsTitle":"Aktuality","newsSeeAll":"Všetky aktuality","catArt":"Stretnutia s umením","catCommunity":"Komunita","catScholar":"Štipendiá","news1Date":"5. júna 2026","news1Title":"Obrazy Wojciecha Gersona v domove sociálnych služieb na Ametystovej ulici","news1Excerpt":"Kurátorka Jolanta Polańska z Národného múzea v Lubline viedla ďalšie inšpiratívne Stretnutie s umením pre obyvateľov domova sociálnych služieb na Ametystovej ulici.","news2Date":"26. mája 2026","news2Title":"Podporujeme tých, ktorí podporujú iných","news2Excerpt":"Tridsať zamestnancov mestských centier podpory rodiny (MOPR) v Lubline absolvovalo školenia vedené našimi terapeutmi, zamerané na prácu s ľuďmi so závislosťami.","news3Date":"7. mája 2026","news3Title":"Hudobno-športové štipendium — ďalšie víťazstvo","news3Excerpt":"Piotr Pawlik z nášho štipendijného programu získal 3. miesto v tímových zostavách juniorov na majstrovstvách Európy v Taekwon-Do v Maribore.","initOverline":"Čím sa zaoberáme","initTitle":"Kľúčové iniciatívy","init1Title":"Pomoc utečencom","init1Text":"Program „Spirit of Ukraine“: psychologická podpora, stretnutia so zamestnávateľmi, odborné školenia, kurzy poľštiny a dary školám, ktoré prijímajú utečenecké deti.","init2Title":"Umenie ako terapia","init2Text":"Organizujeme stretnutia s umením pre seniorov v Lubline — s múzejnými kurátormi — ako aj hudobné štipendiá a tvorivé dielne pre ľudí, ktorí zápasia so samotou, depresiou alebo nedostatkom inšpirácie.","init3Title":"Integrácia komunity","init3Text":"Spájame novoprichádzajúcich a miestnych obyvateľov okolo spoločných projektov — kultúry, vzdelávania a dobrovoľníctva — aby sa z pomoci stalo priateľstvo.","startedOverline":"Začiatky","startedTitle":"Ako sa to začalo","startedText":"Nadácia vznikla v roku 2022, v prvých týždňoch vojny na Ukrajine, keď Lublin — ležiaci blízko hranice — prijal vlnu viac než milióna utečencov. To, čo sa začalo ako núdzová pomoc, sa stalo trvalým záväzkom: dnes nadácia realizuje sociálne a kultúrne projekty a zapája zamestnancov aj dobrovoľníkov.","statuteOverline":"Transparentnosť","statuteTitle":"Štatút a výročné správy","statuteText":"Veríme, že dôvera sa buduje otvorenosťou. Náš štatút, účtovné závierky aj výročné správy o činnosti sú verejné — pozrite si, ako využívame každý dar.","statuteLink1":"Štatút nadácie (PDF)","statuteLink2":"Všetky správy","latestLabel":"Najnovšie","newestLabel":"Najnovšie","cadenceNote":"Nové akcie a príspevky pridávame priebežne","news1Alt":"Stretnutie s umením pre seniorov v Lubline — prednáška v domove sociálnych služieb na Ametystovej ulici","news2Alt":"Školenie pre sociálnych pracovníkov strediska pomoci rodine v Lubline","news3Alt":"Štipendista nadácie na majstrovstvách Európy v Taekwon-Do"},"de":{"heroTitle1":"Hoffnung, Kunst","heroTitle2":"und Gemeinschaft","heroEst":"gegr. 2022","heroTagline":"Wir unterstützen Geflüchtete und vom Krieg betroffene Gemeinschaften. Wir glauben an die stille Kraft der Kunst, die Einsamkeit, Depression und fehlende Inspiration heilt.","heroCta":"Die Stiftung kennenlernen","stat1":"gegründet in Lublin","stat2":"Hilfsprogramme seit 2022","stat3":"direkt und indirekt Erreichte","stat4":"Freiwillige in unseren Aktionen","missionOverline":"Unsere Mission","missionTitle":"Mission","missionP1":"Die Stiftung Stock unterstützt Geflüchtete und lokale Gemeinschaften, die die Krise des Krieges durchleben. Seit 2022 organisieren wir direkte Hilfe in Lublin — einem der größten Aufnahmeorte für Geflüchtete in Polen — mit psychologischer Unterstützung, Jobmessen, Stipendien und Hilfe für Schulen.","missionP2":"Wir glauben auch, dass Kunst eine Form der Fürsorge ist. Mit Kunstbegegnungen, Workshops und gemeinsamem kreativem Schaffen erreichen wir Menschen, die mit Einsamkeit, Depression oder fehlender Inspiration kämpfen — denn emotionales Wohlbefinden verdient dieselbe Aufmerksamkeit wie materielle Bedürfnisse.","missionStat1":"gegründet in Lublin, Polen","missionStat2":"Geflüchtete blieben dauerhaft in Lublin","newsOverline":"Was wir gerade tun","newsTitle":"Aktuelles","newsSeeAll":"Alle Neuigkeiten","catArt":"Kunstbegegnungen","catCommunity":"Gemeinschaft","catScholar":"Stipendien","news1Date":"5. Juni 2026","news1Title":"Gemälde von Wojciech Gerson im Sozialhilfeheim in der Ametystowa-Straße","news1Excerpt":"Kuratorin Jolanta Polańska vom Nationalmuseum in Lublin leitete eine weitere inspirierende Kunstbegegnung für die Bewohner des Sozialhilfeheims in der Ametystowa-Straße.","news2Date":"26. Mai 2026","news2Title":"Wir unterstützen die, die andere unterstützen","news2Excerpt":"Dreißig Mitarbeiter der städtischen Familienhilfezentren (MOPR) in Lublin absolvierten von unseren Therapeuten geleitete Schulungen zur Arbeit mit suchtbetroffenen Menschen.","news3Date":"7. Mai 2026","news3Title":"Musik- und Sportstipendium — ein weiterer Sieg","news3Excerpt":"Piotr Pawlik aus unserem Stipendienprogramm belegte den 3. Platz in den Junioren-Teamformen bei der Taekwon-Do-Europameisterschaft in Maribor.","initOverline":"Was wir tun","initTitle":"Zentrale Initiativen","init1Title":"Hilfe für Geflüchtete","init1Text":"Das Programm „Spirit of Ukraine“: psychologische Unterstützung, Treffen mit Arbeitgebern, Berufsschulungen, Polnischkurse und Spenden für Schulen, die geflüchtete Kinder aufnehmen.","init2Title":"Kunst als Therapie","init2Text":"Wir organisieren Kunstbegegnungen für Senioren in Lublin — mit Museumskuratoren — sowie Musikstipendien und Kreativworkshops für Menschen, die mit Einsamkeit, Depression oder fehlender Inspiration kämpfen.","init3Title":"Integration der Gemeinschaft","init3Text":"Wir bringen Neuankömmlinge und Einheimische in gemeinsamen Projekten zusammen — Kultur, Bildung und Ehrenamt — damit aus Hilfe Freundschaft wird.","startedOverline":"Der Anfang","startedTitle":"Wie alles begann","startedText":"Die Stiftung entstand 2022, in den ersten Wochen des Krieges in der Ukraine, als Lublin — nahe der Grenze gelegen — eine Welle von über einer Million Geflüchteten aufnahm. Was als Nothilfe begann, wurde zu einer dauerhaften Verpflichtung: Heute führt die Stiftung soziale und kulturelle Projekte durch und bindet Mitarbeiter und Freiwillige ein.","statuteOverline":"Transparenz","statuteTitle":"Satzung & Jahresberichte","statuteText":"Wir glauben, dass Vertrauen durch Offenheit entsteht. Unsere Satzung, Jahresabschlüsse und jährlichen Tätigkeitsberichte sind öffentlich — sehen Sie nach, wie wir jede Spende verwenden.","statuteLink1":"Satzung der Stiftung (PDF)","statuteLink2":"Alle Berichte","latestLabel":"Neueste","newestLabel":"Neueste","cadenceNote":"Neue Aktionen und Beiträge kommen laufend hinzu","news1Alt":"Kunstbegegnung für Seniorinnen und Senioren in Lublin — ein Vortrag im Sozialhilfeheim in der Ametystowa-Straße","news2Alt":"Schulung für Sozialarbeitende des Familienhilfezentrums in Lublin","news3Alt":"Ein Stipendiat der Stiftung bei der Taekwon-Do-Europameisterschaft"},"fr":{"heroTitle1":"Espoir, art","heroTitle2":"et communauté","heroEst":"fond. 2022","heroTagline":"Nous soutenons les réfugiés et les communautés touchées par la guerre. Nous croyons au pouvoir silencieux de l’art, qui guérit la solitude, la dépression et le manque d’inspiration.","heroCta":"Découvrir la fondation","stat1":"fondée à Lublin","stat2":"programmes d’aide depuis 2022","stat3":"bénéficiaires directs et indirects","stat4":"bénévoles dans nos initiatives","missionOverline":"Notre mission","missionTitle":"Mission","missionP1":"La Fondation Stock soutient les réfugiés et les communautés locales qui vivent la crise de la guerre. Depuis 2022, nous organisons une aide directe à Lublin — l’un des plus grands points d’accueil de réfugiés en Pologne — avec un soutien psychologique, des salons de l’emploi, des bourses d’études et une aide aux écoles.","missionP2":"Nous croyons aussi que l’art est une forme de soin. À travers les Rencontres avec l’art, les ateliers et la création partagée, nous allons vers les personnes confrontées à la solitude, à la dépression ou au manque d’inspiration — car le bien-être émotionnel mérite la même attention que les besoins matériels.","missionStat1":"fondée à Lublin, en Pologne","missionStat2":"réfugiés restés définitivement à Lublin","newsOverline":"Ce que nous faisons en ce moment","newsTitle":"Actualités","newsSeeAll":"Toutes les actualités","catArt":"Rencontres avec l’art","catCommunity":"Communauté","catScholar":"Bourses d’études","news1Date":"5 juin 2026","news1Title":"La peinture de Wojciech Gerson au foyer d’aide sociale de la rue Ametystowa","news1Excerpt":"La conservatrice Jolanta Polańska, du Musée national de Lublin, a animé une nouvelle Rencontre avec l’art inspirante pour les résidents du foyer d’aide sociale de la rue Ametystowa.","news2Date":"26 mai 2026","news2Title":"Nous soutenons ceux qui soutiennent les autres","news2Excerpt":"Trente employés des centres municipaux d’aide à la famille (MOPR) de Lublin ont suivi des formations animées par nos thérapeutes sur l’accompagnement des personnes touchées par les addictions.","news3Date":"7 mai 2026","news3Title":"Bourse musique et sport — une nouvelle victoire","news3Excerpt":"Piotr Pawlik, de notre programme de bourses, a remporté la 3e place dans les enchaînements par équipes juniors aux Championnats d’Europe de Taekwon-Do à Maribor.","initOverline":"Ce que nous faisons","initTitle":"Initiatives clés","init1Title":"Aide aux réfugiés","init1Text":"Le programme « Spirit of Ukraine » : soutien psychologique, rencontres avec des employeurs, formations professionnelles, cours de polonais et dons aux écoles accueillant des enfants réfugiés.","init2Title":"L’art comme thérapie","init2Text":"Nous organisons des rencontres avec l’art pour les seniors de Lublin — avec des conservateurs de musées — ainsi que des bourses musicales et des ateliers créatifs pour les personnes confrontées à la solitude, à la dépression ou au manque d’inspiration.","init3Title":"Intégration de la communauté","init3Text":"Nous réunissons nouveaux arrivants et habitants autour de projets communs — culture, éducation et bénévolat — pour que l’aide devienne amitié.","startedOverline":"Les débuts","startedTitle":"Comment tout a commencé","startedText":"La fondation est née en 2022, dans les premières semaines de la guerre en Ukraine, lorsque Lublin — proche de la frontière — a accueilli une vague de plus d’un million de réfugiés. Ce qui a commencé comme une aide d’urgence est devenu un engagement durable : aujourd’hui, la fondation mène des projets sociaux et culturels en mobilisant salariés et bénévoles.","statuteOverline":"Transparence","statuteTitle":"Statuts et rapports annuels","statuteText":"Nous croyons que la confiance se construit par l’ouverture. Nos statuts, nos états financiers et nos rapports annuels d’activité sont publics — découvrez comment chaque don est utilisé.","statuteLink1":"Statuts de la fondation (PDF)","statuteLink2":"Tous les rapports","latestLabel":"Dernière","newestLabel":"La plus récente","cadenceNote":"Nouvelles actions et publications ajoutées régulièrement","news1Alt":"Rencontre avec l’art pour les seniors à Lublin — une conférence au foyer d’aide sociale de la rue Ametystowa","news2Alt":"Formation pour les travailleurs sociaux du centre d’aide à la fa
