<script>
const PAGE_I18N = /* CONTENT:PAGE_I18N */{"en":{"catart":"Art Encounters","catcommunity":"Community","catscholar":"Scholarships","readMore":"Read more","backToNews":"Back to all news","shareLabel":"Share","moreOverline":"Keep reading","moreTitle":"More news","notFound":"Article not found."},"pl":{"catart":"Spotkania ze sztuką","catcommunity":"Społeczność","catscholar":"Stypendia","readMore":"Czytaj więcej","backToNews":"Wróć do aktualności","shareLabel":"Udostępnij","moreOverline":"Czytaj dalej","moreTitle":"Więcej aktualności","notFound":"Nie znaleziono artykułu."},"cz":{"catart":"Setkání s uměním","catcommunity":"Komunita","catscholar":"Stipendia","readMore":"Číst dále","backToNews":"Zpět na novinky","shareLabel":"Sdílet","moreOverline":"Číst dále","moreTitle":"Další novinky","notFound":"Článek nenalezen."},"it":{"catart":"Incontri con l’arte","catcommunity":"Comunità","catscholar":"Borse di studio","readMore":"Leggi di più","backToNews":"Torna alle notizie","shareLabel":"Condividi","moreOverline":"Continua a leggere","moreTitle":"Altre notizie","notFound":"Articolo non trovato."}}/* /CONTENT */;

function lang() { return localStorage.getItem('fs-lang') || 'en'; }
/* Each article lives on its own static page (article-<id>.html) with
   window.FS_ARTICLE baked in by build-langs.mjs. The bare article.html
   stays as a fallback for legacy #hash links and redirects them. */
function getId() { return window.FS_ARTICLE || location.hash.slice(1); }

function renderArticle() {
  const l = lang();
  const t = Object.assign({}, PAGE_I18N.en, PAGE_I18N[l]);
  const list = window.ARTICLES || [];
  const a = list.find(x => x.id === getId()) || list[0];
  if (!a) return;

  document.title = a.title[l] + ' — Stock Foundation';
  document.getElementById('crumbTitle').textContent = a.title[l];
  document.getElementById('artTitle').textContent = a.title[l];
  document.getElementById('artCat').textContent = t['cat' + a.cat];
  document.getElementById('artDate').textContent = a.date[l];
  var cover = document.getElementById('artCover');
  var gallery = document.getElementById('artGallery');
  if (a.images && a.images.length) {
    cover.style.display = 'none';
    gallery.style.display = '';
    gallery.innerHTML = '';
    a.images.forEach(function (src) {
      var im = document.createElement('img');
      im.src = src; im.alt = a.title[l];
      im.loading = 'lazy'; im.decoding = 'async';
      gallery.appendChild(im);
    });
  } else {
    gallery.style.display = 'none';
    cover.style.display = '';
    document.getElementById('artImg').src = a.img;
  }

  const body = document.getElementById('artBody');
  body.innerHTML = '';
  a.body[l].forEach(p => { const el = document.createElement('p'); el.textContent = p; body.appendChild(el); });

  document.getElementById('shareLinkedin').href = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(location.href);

  // more news: other articles (max 3)
  const grid = document.getElementById('moreGrid');
  grid.innerHTML = '';
  list.filter(x => x.id !== a.id && !x.hidden).slice(0, 3).forEach(o => {
    const el = document.createElement('article');
    el.className = 'card reveal';
    el.innerHTML =
      '<a href="article-' + o.id + '.html" style="display:flex;flex-direction:column;flex:1;color:inherit;">' +
        '<div class="card-media"><img src="' + o.img + '" alt="" loading="lazy" decoding="async"><span class="cat">' + t['cat' + o.cat] + '</span></div>' +
        '<div class="card-body">' +
          '<time>' + o.date[l] + '</time>' +
          '<h3>' + o.title[l] + '</h3>' +
          '<p>' + o.lead[l] + '</p>' +
          '<span class="read-more" style="margin-top:4px;"><span>' + t.readMore + '</span> <span class="arr">→</span></span>' +
        '</div>' +
      '</a>';
    grid.appendChild(el);
  });
  if (window.observeReveals) window.observeReveals();
}

window.onLangChange = renderArticle;
window.addEventListener('hashchange', renderArticle);
</script>

<script>
(function () { // legacy deep links: article.html#gerson -> article-gerson.html
  if (!window.FS_ARTICLE) {
    var h = location.hash.slice(1);
    if (h && (window.ARTICLES || []).some(function (a) { return a.id === h; })) {
      location.replace('article-' + h + '.html');
      return;
    }
  }
  renderArticle();
})();
</script>
