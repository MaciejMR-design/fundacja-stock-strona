const PAGE_I18N = /* CONTENT:PAGE_I18N */{"en":{"pageTitle":"About us","pageLead":"From emergency aid for refugees to a lasting platform for social and cultural projects — the story of the Stock Foundation.","badgeLabel":"Est. in Lublin","startedOverline":"How it has","startedTitle":"Started","startedP1":"The impetus to set up a charitable foundation came from the sudden influx of huge numbers of refugees from Ukraine, triggered by the Russian attack on 24 February 2022. Aware of the anticipated long-lasting conflict, we decided to set up a foundation to support Ukrainian refugees, particularly in Lublin, due to its close proximity to the Ukrainian border.","startedP2":"Since the beginning of the war, the City of Lublin was one of the major reception points for Ukrainian refugees and became one of the biggest refugee clusters in Poland. It has taken in over a million people, and approximately 60 thousand have stayed in Lublin permanently.","startedP3":"From its inception, the Stock Foundation focused on alleviating the crisis resulting from the influx of refugees — providing aid to schools accommodating refugee children, offering psychological support to those traumatized by the conflict, and facilitating employment opportunities for those affected.","souOverline":"Spirit of Ukraine","souTitle":"Our key initiatives for refugees","awardOverline":"Recognition","awardTitle":"Medal \"Lublin Bohaterom\"","awardText":"In 2023 the Mayor of Lublin, Dr Krzysztof Żuk, honored the Stock Foundation with the \"Lublin Bohaterom\" (Lublin to Its Heroes) Medal for its work during the humanitarian crisis.","awardQuote":"“In honor of great deeds and merits in the service of victims of the humanitarian crisis, with special recognition for the strategic support of the City of Lublin in bringing help to the Ukrainian Nation, and for the contribution to promoting noble values.”","awardSrc":"— Mayor of Lublin, Dr Krzysztof Żuk · Lublin, 2023","souLead":"To achieve its objectives, the Foundation launched the \"Spirit of Ukraine\" program in Lublin — a multi-faceted approach to help refugees find safety, work and community.","sou1T":"Psychological Support","sou1X":"Therapies led by qualified psychologists, providing emotional support and tools to cope with the trauma of war, in a safe space for open communication.","sou2T":"Integration Job Fairs","sou2X":"Regular meetings for refugees, offering opportunities to connect with employers and help with immigration issues — an inclusive platform to share experiences.","sou3T":"Music Scholarships","sou3X":"Funding music education for talented Ukrainian children, enabling them to pursue their passion, and supporting music teachers in their careers.","sou4T":"Vocational Training","sou4X":"Office training programs for refugees, increasing their employability and independence.","sou5T":"Support for Schools","sou5X":"Donations of equipment and materials for schools, supporting the integration of refugee children into the school community.","sou6T":"Polish Language Courses","sou6X":"Language courses for refugees, helping them integrate and increase their communication skills.","evoOverline":"How is it","evoTitle":"Evolving","evoLead":"From the beginning it was assumed that as the refugee crisis subsided, the Stock Foundation would become a platform for important social projects — engaging employees and recruiting volunteers. Today our work revolves around the accessibility of culture and art, addressing social isolation and empowering local communities.","tl1When":"2022 — Founding","tl1T":"Emergency refugee aid","tl1X":"The foundation is set up in Lublin in the first weeks of the war and launches the \"Spirit of Ukraine\" program.","tl2When":"2023–2024 — Growth","tl2T":"Advocacy of arts and culture","tl2X":"Championing arts and culture through awareness campaigns, educational programs and support for artists and cultural institutions.","ev1T":"Advocacy and Promotion of Arts and Culture","ev1X":"A commitment to championing arts and culture — through awareness campaigns, educational programs and support for artists and cultural institutions. See how a Flavours of Change grant transformed a kindergarten in Šišan, Croatia.","ev2T":"Art and Mental Health","ev2X":"Recognizing the positive influence of art on mental health — a continuity from the foundation’s first initiatives, addressing emotional well-being through culturally enriching activities and experiences.","ev3T":"Creative and Collective Activities","ev3X":"Encouraging people to spend time together and explore new ways to do so — events, workshops and initiatives that foster creativity and social interaction, motivating people to step out of their comfort zones.","tl3When":"Today","tl3T":"Art, mental health & community","tl3X":"Art Encounters, scholarships and creative collective activities that support mental health and bring people together — across generations.","ctaTitle":"See what we are doing right now","ctaNews":"Our latest actions"},"pl":{"pageTitle":"O nas","pageLead":"Od pomocy doraźnej dla uchodźców do trwałej platformy projektów społecznych i kulturalnych — historia Fundacji Stock.","badgeLabel":"Zał. w Lublinie","startedOverline":"Jak to się","startedTitle":"Zaczęło","startedP1":"Impulsem do założenia fundacji charytatywnej był nagły napływ ogromnej liczby uchodźców z Ukrainy po ataku Rosji 24 lutego 2022 roku. Świadomi przewidywanego, długotrwałego konfliktu, postanowiliśmy powołać fundację wspierającą uchodźców, szczególnie w Lublinie — ze względu na bliskość granicy z Ukrainą.","startedP2":"Od początku wojny Lublin był jednym z głównych punktów recepcyjnych dla uchodźców z Ukrainy i stał się jednym z największych skupisk uchodźczych w Polsce. Przyjął ponad milion osób, a około 60 tysięcy zostało w Lublinie na stałe.","startedP3":"Od momentu powstania Fundacja Stock koncentrowała się na łagodzeniu kryzysu — pomagając szkołom przyjmującym dzieci uchodźcze, oferując wsparcie psychologiczne osobom dotkniętym traumą konfliktu i ułatwiając znalezienie zatrudnienia.","souOverline":"Spirit of Ukraine","souTitle":"Kluczowe inicjatywy dla uchodźców","awardOverline":"Wyróżnienie","awardTitle":"Medal \"Lublin Bohaterom\"","awardText":"W 2023 roku Prezydent Miasta Lublin dr Krzysztof Żuk uhonorował Fundację Stock Medalem „Lublin Bohaterom” za działalność w czasie kryzysu humanitarnego.","awardQuote":"„Dla uhonorowania wielkich czynów oraz zasług w służbie ofiarom kryzysu humanitarnego, z wyrazami szczególnego uznania za strategiczne wsparcie Miasta Lublin w niesieniu pomocy Narodowi Ukraińskiemu oraz wkład w propagowanie szlachetnych wartości.”","awardSrc":"— Prezydent Miasta Lublin dr Krzysztof Żuk · Lublin, 2023","souLead":"Aby realizować swoje cele, Fundacja uruchomiła w Lublinie program „Spirit of Ukraine\" — wielowymiarowe wsparcie pomagające uchodźcom odnaleźć bezpieczeństwo, pracę i wspólnotę.","sou1T":"Wsparcie psychologiczne","sou1X":"Terapie prowadzone przez wykwalifikowanych psychologów — wsparcie emocjonalne i narzędzia radzenia sobie z traumą wojny, w bezpiecznej przestrzeni otwartej rozmowy.","sou2T":"Integracyjne targi pracy","sou2X":"Regularne spotkania dla uchodźców — możliwość kontaktu z pracodawcami i pomoc w sprawach imigracyjnych, platforma wymiany doświadczeń.","sou3T":"Stypendia muzyczne","sou3X":"Finansowanie edukacji muzycznej utalentowanych ukraińskich dzieci oraz wsparcie nauczycieli muzyki w utrzymaniu umiejętności i aktywizacji zawodowej.","sou4T":"Szkolenia zawodowe","sou4X":"Programy szkoleń biurowych dla uchodźców, zwiększające ich szanse na zatrudnienie i samodzielność.","sou5T":"Wsparcie dla szkół","sou5X":"Darowizny sprzętu i materiałów dla szkół, wspierające integrację dzieci uchodźczych ze społecznością szkolną.","sou6T":"Kursy języka polskiego","sou6X":"Kursy językowe dla uchodźców, pomagające w integracji i rozwijaniu umiejętności komunikacyjnych.","evoOverline":"Jak się","evoTitle":"Rozwijamy","evoLead":"Od początku zakładano, że gdy kryzys uchodźczy osłabnie, Fundacja Stock stanie się platformą ważnych projektów społecznych — angażującą pracowników i wolontariuszy. Dziś nasza praca koncentruje się na dostępności kultury i sztuki, przeciwdziałaniu izolacji społecznej i wzmacnianiu lokalnych społeczności.","tl1When":"2022 — Założenie","tl1T":"Pomoc doraźna dla uchodźców","tl1X":"Fundacja powstaje w Lublinie w pierwszych tygodniach wojny i uruchamia program „Spirit of Ukraine\".","tl2When":"2023–2024 — Rozwój","tl2T":"Promocja sztuki i kultury","tl2X":"Działania na rzecz sztuki i kultury: kampanie społeczne, programy edukacyjne, wsparcie artystów i instytucji kultury.","ev1T":"Promocja sztuki i kultury","ev1X":"Zobowiązanie do działania na rzecz sztuki i kultury — poprzez kampanie społeczne, programy edukacyjne i wsparcie artystów oraz instytucji kultury. Zobacz, jak grant Flavours of Change odmienił przedszkole w Šišan w Chorwacji.","ev2T":"Sztuka a zdrowie psychiczne","ev2X":"Uznanie pozytywnego wpływu sztuki na zdrowie psychiczne — kontynuacja pierwszych inicjatyw fundacji, dbanie o dobrostan emocjonalny poprzez wzbogacające kulturalnie działania i doświadczenia.","ev3T":"Twórcze i wspólne działania","ev3X":"Zachęcanie ludzi do wspólnego spędzania czasu i odkrywania nowych form aktywności — wydarzenia, warsztaty i inicjatywy rozwijające kreatywność i relacje, motywujące do wyjścia ze strefy komfortu.","tl3When":"Dziś","tl3T":"Sztuka, zdrowie psychiczne i wspólnota","tl3X":"Spotkania ze Sztuką, stypendia i wspólne działania twórcze wspierające zdrowie psychiczne i łączące ludzi — ponad pokoleniami.","ctaTitle":"Zobacz, co robimy właśnie teraz","ctaNews":"Nasze ostatnie akcje"},"cz":{"pageTitle":"O nás","pageLead":"Od nouzové pomoci uprchlíkům k trvalé platformě sociálních a kulturních projektů — příběh Nadace Stock.","badgeLabel":"Zal. v Lublinu","startedOverline":"Jak to","startedTitle":"Začalo","startedP1":"Impulsem k založení charitativní nadace byl náhlý příliv obrovského počtu uprchlíků z Ukrajiny po ruském útoku 24. února 2022. S vědomím očekávaného dlouhotrvajícího konfliktu jsme se rozhodli založit nadaci na podporu ukrajinských uprchlíků, zejména v Lublinu — kvůli blízkosti ukrajinské hranice.","startedP2":"Od začátku války byl Lublin jedním z hlavních přijímacích míst pro ukrajinské uprchlíky a stal se jedním z největších uprchlických center v Polsku. Přijal více než milion lidí a přibližně 60 tisíc jich v Lublinu zůstalo natrvalo.","startedP3":"Od svého vzniku se Nadace Stock soustředila na zmírňování krize — pomocí školám přijímajícím uprchlické děti, psychologickou podporou lidem traumatizovaným konfliktem a usnadňováním pracovních příležitostí.","souOverline":"Spirit of Ukraine","souTitle":"Klíčové iniciativy pro uprchlíky","awardOverline":"Ocenění","awardTitle":"Medaile „Lublin Bohaterom”","awardText":"V roce 2023 udělil primátor Lublinu dr. Krzysztof Żuk Nadaci Stock medaili „Lublin Bohaterom” (Lublin svým hrdinům) za činnost během humanitární krize.","awardQuote":"„Na počest velkých činů a zásluh ve službě obětem humanitární krize, se zvláštním uznáním za strategickou podporu města Lublin při pomoci ukrajinskému národu a za přínos k šíření ušlechtilých hodnot.”","awardSrc":"— primátor Lublinu dr. Krzysztof Żuk · Lublin, 2023","souLead":"K naplnění svých cílů nadace spustila v Lublinu program „Spirit of Ukraine\" — mnohostrannou podporu pomáhající uprchlíkům najít bezpečí, práci a komunitu.","sou1T":"Psychologická podpora","sou1X":"Terapie vedené kvalifikovanými psychology — emoční podpora a nástroje ke zvládání válečného traumatu v bezpečném prostoru otevřené komunikace.","sou2T":"Integrační veletrhy práce","sou2X":"Pravidelná setkání pro uprchlíky — kontakt se zaměstnavateli a pomoc s imigračními záležitostmi, platforma pro sdílení zkušeností.","sou3T":"Hudební stipendia","sou3X":"Financování hudebního vzdělání talentovaných ukrajinských dětí a podpora učitelů hudby v udržení dovedností a kariéře.","sou4T":"Odborná školení","sou4X":"Kancelářské vzdělávací programy pro uprchlíky zvyšující jejich zaměstnatelnost a samostatnost.","sou5T":"Podpora škol","sou5X":"Dary vybavení a materiálů školám, podporující integraci uprchlických dětí do školní komunity.","sou6T":"Kurzy polštiny","sou6X":"Jazykové kurzy pro uprchlíky, pomáhající s integrací a rozvojem komunikačních dovedností.","evoOverline":"Jak se","evoTitle":"Vyvíjíme","evoLead":"Od začátku se počítalo s tím, že až uprchlická krize odezní, stane se Nadace Stock platformou důležitých sociálních projektů — zapojující zaměstnance a dobrovolníky. Dnes se naše práce soustředí na dostupnost kultury a umění, boj se sociální izolací a posilování místních komunit.","tl1When":"2022 — Založení","tl1T":"Nouzová pomoc uprchlíkům","tl1X":"Nadace vzniká v Lublinu v prvních týdnech války a spouští program „Spirit of Ukraine\".","tl2When":"2023–2024 — Růst","tl2T":"Podpora umění a kultury","tl2X":"Prosazování umění a kultury: osvětové kampaně, vzdělávací programy, podpora umělců a kulturních institucí.","ev1T":"Podpora umění a kultury","ev1X":"Závazek prosazovat umění a kulturu — prostřednictvím osvětových kampaní, vzdělávacích programů a podpory umělců a kulturních institucí. Podívejte se, jak grant Flavours of Change proměnil školku v chorvatském Šišanu.","ev2T":"Umění a duševní zdraví","ev2X":"Uznání pozitivního vlivu umění na duševní zdraví — návaznost na první iniciativy nadace, péče o duševní pohodu skrze kulturně obohacující aktivity a zážitky.","ev3T":"Tvořivé a společné aktivity","ev3X":"Povzbuzování lidí ke společně strávenému času a objevování nových forem aktivit — akce, dílny a iniciativy rozvíjející kreativitu a vztahy, motivující vyjít z komfortní zóny.","tl3When":"Dnes","tl3T":"Umění, duševní zdraví a komunita","tl3X":"Setkání s uměním, stipendia a společné tvořivé aktivity podporující duševní zdraví a spojující lidi — napříč generacemi.","ctaTitle":"Podívejte se, co právě děláme","ctaNews":"Naše poslední akce"},"it":{"pageTitle":"Chi siamo","pageLead":"Dall’aiuto d’emergenza per i rifugiati a una piattaforma duratura di progetti sociali e culturali — la storia della Fondazione Stock.","badgeLabel":"Fond. a Lublino","startedOverline":"Come è","startedTitle":"Iniziato","startedP1":"L’impulso a creare una fondazione benefica è venuto dall’improvviso afflusso di un enorme numero di rifugiati dall’Ucraina, innescato dall’attacco russo del 24 febbraio 2022. Consapevoli del previsto conflitto di lunga durata, abbiamo deciso di fondare una fondazione per sostenere i rifugiati ucraini, in particolare a Lublino, per la sua vicinanza al confine ucraino.","startedP2":"Dall’inizio della guerra, la città di Lublino è stata uno dei principali punti di accoglienza per i rifugiati ucraini e uno dei maggiori centri di rifugiati in Polonia. Ha accolto oltre un milione di persone e circa 60 mila sono rimaste stabilmente a Lublino.","startedP3":"Fin dalla nascita, la Fondazione Stock si è concentrata sull’attenuazione della crisi — aiutando le scuole che accolgono bambini rifugiati, offrendo sostegno psicologico alle persone traumatizzate dal conflitto e facilitando le opportunità di lavoro.","souOverline":"Spirit of Ukraine","souTitle":"Le iniziative chiave per i rifugiati","awardOverline":"Riconoscimento","awardTitle":"Medaglia „Lublin Bohaterom”","awardText":"Nel 2023 il Sindaco di Lublino, dott. Krzysztof Żuk, ha conferito alla Fondazione Stock la Medaglia „Lublin Bohaterom” (Lublino ai suoi eroi) per il lavoro svolto durante la crisi umanitaria.","awardQuote":"“In onore delle grandi azioni e dei meriti al servizio delle vittime della crisi umanitaria, con particolare riconoscimento per il sostegno strategico alla Città di Lublino nell’aiuto alla Nazione Ucraina e per il contributo alla promozione di nobili valori.”","awardSrc":"— Sindaco di Lublino dott. Krzysztof Żuk · Lublino, 2023","souLead":"Per raggiungere i suoi obiettivi, la Fondazione ha lanciato a Lublino il programma \"Spirit of Ukraine\" — un approccio multiforme per aiutare i rifugiati a trovare sicurezza, lavoro e comunità.","sou1T":"Sostegno psicologico","sou1X":"Terapie condotte da psicologi qualificati — sostegno emotivo e strumenti per affrontare il trauma della guerra, in uno spazio sicuro di comunicazione aperta.","sou2T":"Fiere del lavoro integrative","sou2X":"Incontri regolari per i rifugiati — contatti con i datori di lavoro e aiuto con le questioni migratorie, una piattaforma per condividere esperienze.","sou3T":"Borse di studio musicali","sou3X":"Finanziamento dell’educazione musicale di bambini ucraini di talento e sostegno agli insegnanti di musica nelle loro carriere.","sou4T":"Formazione professionale","sou4X":"Programmi di formazione d’ufficio per i rifugiati, che aumentano occupabilità e indipendenza.","sou5T":"Sostegno alle scuole","sou5X":"Donazioni di attrezzature e materiali alle scuole, a sostegno dell’integrazione dei bambini rifugiati nella comunità scolastica.","sou6T":"Corsi di lingua polacca","sou6X":"Corsi di lingua per i rifugiati, che aiutano l’integrazione e le capacità comunicative.","evoOverline":"Come ci","evoTitle":"Evolviamo","evoLead":"Fin dall’inizio si prevedeva che, attenuandosi la crisi dei rifugiati, la Fondazione Stock sarebbe diventata una piattaforma per importanti progetti sociali — coinvolgendo dipendenti e volontari. Oggi il nostro lavoro ruota attorno all’accessibilità della cultura e dell’arte, al contrasto dell’isolamento sociale e al rafforzamento delle comunità locali.","tl1When":"2022 — Fondazione","tl1T":"Aiuto d’emergenza ai rifugiati","tl1X":"La fondazione nasce a Lublino nelle prime settimane della guerra e lancia il programma \"Spirit of Ukraine\".","tl2When":"2023–2024 — Crescita","tl2T":"Promozione di arte e cultura","tl2X":"Sostegno ad arte e cultura: campagne di sensibilizzazione, programmi educativi, supporto ad artisti e istituzioni culturali.","ev1T":"Promozione delle arti e della cultura","ev1X":"Un impegno a sostenere le arti e la cultura — attraverso campagne di sensibilizzazione, programmi educativi e supporto ad artisti e istituzioni culturali. Scopri come una borsa Flavours of Change ha trasformato un asilo a Šišan, in Croazia.","ev2T":"Arte e salute mentale","ev2X":"Il riconoscimento dell’influenza positiva dell’arte sulla salute mentale — in continuità con le prime iniziative della fondazione, prendendosi cura del benessere emotivo con attività culturalmente arricchenti.","ev3T":"Attività creative e collettive","ev3X":"Incoraggiare le persone a passare del tempo insieme e a esplorare nuovi modi per farlo — eventi, laboratori e iniziative che stimolano creatività e relazioni, motivando a uscire dalla propria zona di comfort.","tl3When":"Oggi","tl3T":"Arte, salute mentale e comunità","tl3X":"Incontri con l’Arte, borse di studio e attività creative collettive che sostengono la salute mentale e uniscono le persone — attraverso le generazioni.","ctaTitle":"Guarda cosa stiamo facendo proprio ora","ctaNews":"Le nostre ultime azioni"}}/* /CONTENT */;
