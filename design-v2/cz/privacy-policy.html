const PAGE_I18N = /* CONTENT:PAGE_I18N */{"en":{"pageTitle":"Privacy and Cookies","pageLead":"How this website handles your data — plainly and transparently.","updated":"Last updated: 30 July 2026","s1T":"1. Data controller","s1a":"The controller of personal data processed in connection with this website is the Stock Foundation (Fundacja Stock), with its registered office in Lublin:","s2T":"2. Purposes of processing","s2a":"Personal data are processed for the following purposes:","s2l1":"Handling enquiries sent to us directly by e-mail or phone — including questions about the foundation’s activities, partnerships, volunteering and donations.","s2l2":"Analysing website traffic and optimising our content.","s2l3":"Ensuring the security of the website.","s2l4":"Managing cookie consents and remembering your preferences.","s2b":"Providing your data is voluntary; however, if you contact us, it is necessary to handle your enquiry. We do not make automated decisions producing legal effects based on the data collected, nor do we carry out profiling.","s3T":"3. Scope of the data processed","s3aT":"Data provided voluntarily when you contact us:","s3a":"If you contact us directly (by e-mail or phone), we process your e-mail address, phone number, name and any other information you voluntarily provide in the conversation or in the message.","s3bT":"Data collected automatically (analytics and logs):","s3b":"The IP address of your device, information about your browser and operating system, time spent on the site, pages visited, the source of your visit and your cookie preferences.","s4T":"4. Legal basis of processing","s4l1":"Art. 6(1)(a) GDPR (consent) — for optional analytics cookies (Google Analytics), installed only if you agree.","s4l2":"Art. 6(1)(f) GDPR (legitimate interest) — for handling correspondence, ensuring the security of the website, remembering your privacy preferences (necessary entries) and pursuing potential claims.","s5T":"5. Recipients of the data","s5a":"The website operates thanks to external service providers. Your data may be entrusted to the following categories of entities:","s5l1":"Hosting and technical service providers maintaining the website.","s5l2":"E-mail service providers handling our correspondence.","s5l3":"Analytics providers: Google Ireland Limited (Google Analytics, Google Search Console).","s5l4":"Entities authorised to provide accounting and legal services to the foundation.","s6T":"6. Analytics tools and cookies","s6aT":"Necessary cookies and local storage:","s6a":"Required for the website to work properly — they remember your selected language (the “fs-lang” entry) and your decision regarding cookies (the “fs-consent” entry). They are stored in your browser’s local storage on your device and cannot be switched off.","s6bT":"Analytics cookies:","s6b":"With your consent, we use Google Analytics 4, provided by Google Ireland Limited, to analyse website traffic. The tool does not log full IP addresses of EU users, and the reported data are statistical in nature. Analytics entries are installed only after you give consent in the cookie banner; consent can also be refused.","s6cT":"Google Search Console:","s6c":"We use this tool to monitor the site’s presence in search results and to optimise content. It does not involve installing any cookies on your device.","s6d":"We do not use marketing or advertising cookies. You can manage your preferences at any time in the cookie banner or through your browser settings.","s7T":"7. Transfers outside the EEA","s7a":"In connection with the use of Google tools, your data may be transferred to third countries (e.g. the USA). These entities ensure an adequate level of data protection through participation in programmes such as the EU–US Data Privacy Framework.","s8T":"8. Your rights","s8a":"You have the right to:","s8l1":"Access your data and have it rectified.","s8l2":"Have your data erased or restrict its processing.","s8l3":"Data portability.","s8l4":"Withdraw your consent to cookies at any time (by clearing your browser data or changing your choice in the banner) — without affecting the lawfulness of processing carried out before the withdrawal.","s8l5":"Object to the processing of your data.","s8l6":"Lodge a complaint with the President of the Personal Data Protection Office (PUODO), ul. Stawki 2, 00-193 Warsaw, Poland.","s9T":"9. Retention periods","s9a":"Correspondence is kept for the period necessary to handle the enquiry and then until potential claims become time-barred (as a rule, no longer than 6 years). Preferences saved in your browser’s local storage (language, cookie decision) remain on your device until you delete them. Google Analytics data are deleted automatically after the retention period (a maximum of 14 months).","s10T":"10. Data security","s10a":"We apply appropriate technical and organisational measures (including SSL/TLS encryption) to protect the processed data against unauthorised access or loss.","s11T":"11. Contact","s11a":"In matters concerning the protection of personal data, please contact us:","s12T":"12. Changes to this privacy policy","s12a":"The controller reserves the right to amend this privacy policy. Changes will be published on this page together with the date of the update. We recommend reviewing this document regularly."},"pl":{"pageTitle":"Prywatność i cookies","pageLead":"Jak ta strona obchodzi się z Twoimi danymi — prosto i przejrzyście.","updated":"Ostatnia aktualizacja: 30 lipca 2026","s1T":"1. Administrator danych","s1a":"Administratorem danych osobowych przetwarzanych w ramach tej strony internetowej jest Fundacja Stock z siedzibą w Lublinie:","s2T":"2. Cele przetwarzania danych","s2a":"Dane osobowe przetwarzane są w następujących celach:","s2l1":"Obsługa zapytań kierowanych do nas bezpośrednio drogą e-mailową lub telefoniczną — w tym pytań o działalność fundacji, współpracę, wolontariat i darowizny.","s2l2":"Analiza ruchu na stronie i optymalizacja treści.","s2l3":"Zapewnienie bezpieczeństwa strony.","s2l4":"Zarządzanie zgodami na pliki cookies i zapamiętywanie Twoich preferencji.","s2b":"Podanie danych jest dobrowolne, jednak w przypadku kontaktu z nami — niezbędne do obsługi Twojej sprawy. Na podstawie zbieranych danych nie podejmujemy zautomatyzowanych decyzji wywołujących skutki prawne ani nie prowadzimy profilowania.","s3T":"3. Zakres przetwarzanych danych","s3aT":"Dane przekazywane dobrowolnie podczas kontaktu:","s3a":"Jeśli kontaktujesz się z nami bezpośrednio (mailowo lub telefonicznie), przetwarzamy Twój adres e-mail, numer telefonu, imię i nazwisko oraz inne informacje, które dobrowolnie podasz w trakcie rozmowy lub w treści wiadomości.","s3bT":"Dane zbierane automatycznie (analityka i logi):","s3b":"Adres IP urządzenia, informacje o przeglądarce i systemie operacyjnym, czas spędzony na stronie, odwiedzane podstrony, źródło wejścia na stronę oraz preferencje dotyczące plików cookies.","s4T":"4. Podstawa prawna przetwarzania","s4l1":"Art. 6 ust. 1 lit. a RODO (zgoda) — w przypadku opcjonalnych analitycznych plików cookies (Google Analytics), instalowanych wyłącznie za Twoją zgodą.","s4l2":"Art. 6 ust. 1 lit. f RODO (prawnie uzasadniony interes) — w celu obsługi korespondencji, zapewnienia bezpieczeństwa strony, zapisania Twoich preferencji prywatności (wpisy niezbędne) oraz dochodzenia ewentualnych roszczeń.","s5T":"5. Odbiorcy danych","s5a":"Strona funkcjonuje dzięki zewnętrznym dostawcom usług. Twoje dane mogą być powierzane następującym kategoriom podmiotów:","s5l1":"Dostawcy usług hostingowych i technicznych utrzymujący stronę.","s5l2":"Dostawcy usług e-mail obsługujący naszą korespondencję.","s5l3":"Dostawcy analityki: Google Ireland Limited (Google Analytics, Google Search Console).","s5l4":"Podmioty upoważnione do obsługi księgowej i prawnej fundacji.","s6T":"6. Narzędzia analityczne i pliki cookies","s6aT":"Niezbędne pliki cookies i pamięć lokalna:","s6a":"Konieczne do prawidłowego działania strony — zapamiętują wybrany język (wpis „fs-lang”) oraz Twoją decyzję dotyczącą cookies (wpis „fs-consent”). Są zapisywane w pamięci lokalnej przeglądarki (localStorage) na Twoim urządzeniu i nie można ich wyłączyć.","s6bT":"Analityczne pliki cookies:","s6b":"Za Twoją zgodą korzystamy z Google Analytics 4, dostarczanego przez Google Ireland Limited, do analizy ruchu na stronie. Narzędzie nie zapisuje pełnych adresów IP użytkowników z UE, a raportowane dane mają charakter statystyczny. Pliki analityczne instalowane są wyłącznie po wyrażeniu zgody w banerze cookies; zgodę można też odrzucić.","s6cT":"Google Search Console:","s6c":"Używamy tego narzędzia do monitorowania obecności strony w wynikach wyszukiwania i optymalizacji treści. Nie wiąże się ono z instalowaniem plików cookies na Twoim urządzeniu.","s6d":"Nie używamy cookies marketingowych ani reklamowych. Preferencjami możesz zarządzać w każdej chwili w banerze cookies lub w ustawieniach przeglądarki.","s7T":"7. Przekazywanie danych poza EOG","s7a":"W związku z korzystaniem z narzędzi firmy Google Twoje dane mogą być przekazywane do państw trzecich (np. USA). Podmioty te zapewniają odpowiedni poziom ochrony danych poprzez udział w programach takich jak EU–US Data Privacy Framework.","s8T":"8. Twoje prawa","s8a":"Przysługuje Ci prawo do:","s8l1":"Dostępu do treści swoich danych oraz ich sprostowania.","s8l2":"Usunięcia lub ograniczenia przetwarzania.","s8l3":"Przenoszenia danych.","s8l4":"Cofnięcia zgody na pliki cookies w dowolnym momencie (poprzez wyczyszczenie danych przeglądarki lub zmianę decyzji w banerze) — bez wpływu na zgodność z prawem przetwarzania dokonanego przed cofnięciem zgody.","s8l5":"Wniesienia sprzeciwu wobec przetwarzania.","s8l6":"Wniesienia skargi do Prezesa Urzędu Ochrony Danych Osobowych (PUODO), ul. Stawki 2, 00-193 Warszawa.","s9T":"9. Okres przechowywania","s9a":"Dane z korespondencji przechowujemy przez okres niezbędny do obsługi zapytania, a następnie do upływu terminów przedawnienia ewentualnych roszczeń (co do zasady nie dłużej niż 6 lat). Preferencje zapisane w pamięci lokalnej przeglądarki (język, decyzja dotycząca cookies) pozostają na Twoim urządzeniu do czasu ich usunięcia przez Ciebie. Dane w Google Analytics usuwane są automatycznie po upływie okresu retencji (maksymalnie 14 miesięcy).","s10T":"10. Bezpieczeństwo danych","s10a":"Stosujemy odpowiednie środki techniczne i organizacyjne (m.in. szyfrowanie SSL/TLS) zapewniające bezpieczeństwo przetwarzanych danych przed nieuprawnionym dostępem czy utratą.","s11T":"11. Kontakt","s11a":"W sprawach dotyczących ochrony danych osobowych prosimy o kontakt:","s12T":"12. Zmiany polityki prywatności","s12a":"Administrator zastrzega sobie prawo do wprowadzania zmian w niniejszej polityce prywatności. Zmiany będą publikowane na tej stronie wraz z datą aktualizacji. Zalecamy regularne zapoznawanie się z treścią dokumentu."},"cz":{"pageTitle":"Soukromí a cookies","pageLead":"Jak tento web nakládá s vašimi daty — jednoduše a transparentně.","updated":"Poslední aktualizace: 30. července 2026","s1T":"1. Správce údajů","s1a":"Správcem osobních údajů zpracovávaných v rámci tohoto webu je Nadace Stock (Fundacja Stock) se sídlem v Lublinu:","s2T":"2. Účely zpracování","s2a":"Osobní údaje jsou zpracovávány pro následující účely:","s2l1":"Vyřizování dotazů zaslaných nám přímo e-mailem nebo telefonicky — včetně dotazů na činnost nadace, spolupráci, dobrovolnictví a dary.","s2l2":"Analýza návštěvnosti webu a optimalizace obsahu.","s2l3":"Zajištění bezpečnosti webu.","s2l4":"Správa souhlasů s cookies a zapamatování vašich preferencí.","s2b":"Poskytnutí údajů je dobrovolné; pokud nás však kontaktujete, je nezbytné k vyřízení vaší záležitosti. Na základě shromážděných údajů nepřijímáme automatizovaná rozhodnutí s právními účinky ani neprovádíme profilování.","s3T":"3. Rozsah zpracovávaných údajů","s3aT":"Údaje poskytnuté dobrovolně při kontaktu:","s3a":"Pokud nás kontaktujete přímo (e-mailem nebo telefonicky), zpracováváme vaši e-mailovou adresu, telefonní číslo, jméno a příjmení a další informace, které dobrovolně sdělíte během hovoru nebo v obsahu zprávy.","s3bT":"Údaje shromažďované automaticky (analytika a logy):","s3b":"IP adresa zařízení, informace o prohlížeči a operačním systému, čas strávený na webu, navštívené stránky, zdroj návštěvy a preference týkající se cookies.","s4T":"4. Právní základ zpracování","s4l1":"Čl. 6 odst. 1 písm. a GDPR (souhlas) — v případě volitelných analytických cookies (Google Analytics), instalovaných výhradně s vaším souhlasem.","s4l2":"Čl. 6 odst. 1 písm. f GDPR (oprávněný zájem) — za účelem vyřizování korespondence, zajištění bezpečnosti webu, uložení vašich preferencí soukromí (nezbytné záznamy) a vymáhání případných nároků.","s5T":"5. Příjemci údajů","s5a":"Web funguje díky externím poskytovatelům služeb. Vaše údaje mohou být svěřovány následujícím kategoriím subjektů:","s5l1":"Poskytovatelé hostingových a technických služeb udržující web.","s5l2":"Poskytovatelé e-mailových služeb zajišťující naši korespondenci.","s5l3":"Poskytovatelé analytiky: Google Ireland Limited (Google Analytics, Google Search Console).","s5l4":"Subjekty pověřené účetní a právní obsluhou nadace.","s6T":"6. Analytické nástroje a cookies","s6aT":"Nezbytné cookies a lokální úložiště:","s6a":"Nutné pro správné fungování webu — pamatují si zvolený jazyk (záznam „fs-lang“) a vaše rozhodnutí ohledně cookies (záznam „fs-consent“). Jsou uloženy v lokálním úložišti prohlížeče (localStorage) na vašem zařízení a nelze je vypnout.","s6bT":"Analytické cookies:","s6b":"S vaším souhlasem používáme Google Analytics 4 od Google Ireland Limited k analýze návštěvnosti webu. Nástroj nezaznamenává úplné IP adresy uživatelů z EU a vykazovaná data mají statistický charakter. Analytické záznamy se instalují až po udělení souhlasu v cookie liště; souhlas lze rovněž odmítnout.","s6cT":"Google Search Console:","s6c":"Tento nástroj používáme k monitorování přítomnosti webu ve výsledcích vyhledávání a k optimalizaci obsahu. Nespojuje se s instalací cookies na vašem zařízení.","s6d":"Nepoužíváme marketingové ani reklamní cookies. Preference můžete kdykoli spravovat v cookie liště nebo v nastavení prohlížeče.","s7T":"7. Předávání údajů mimo EHP","s7a":"V souvislosti s používáním nástrojů společnosti Google mohou být vaše údaje předávány do třetích zemí (např. USA). Tyto subjekty zajišťují odpovídající úroveň ochrany údajů účastí v programech, jako je EU–US Data Privacy Framework.","s8T":"8. Vaše práva","s8a":"Máte právo na:","s8l1":"Přístup ke svým údajům a jejich opravu.","s8l2":"Výmaz nebo omezení zpracování.","s8l3":"Přenositelnost údajů.","s8l4":"Odvolání souhlasu s cookies kdykoli (vymazáním dat prohlížeče nebo změnou rozhodnutí v liště) — aniž by tím byla dotčena zákonnost zpracování provedeného před odvoláním souhlasu.","s8l5":"Vznesení námitky proti zpracování.","s8l6":"Podání stížnosti u předsedy polského Úřadu pro ochranu osobních údajů (PUODO), ul. Stawki 2, 00-193 Varšava, Polsko.","s9T":"9. Doba uchovávání","s9a":"Údaje z korespondence uchováváme po dobu nezbytnou k vyřízení dotazu a poté do uplynutí promlčecích lhůt případných nároků (zpravidla nejdéle 6 let). Preference uložené v lokálním úložišti prohlížeče (jazyk, rozhodnutí o cookies) zůstávají na vašem zařízení, dokud je sami nesmažete. Data v Google Analytics se automaticky mažou po uplynutí doby retence (maximálně 14 měsíců).","s10T":"10. Zabezpečení údajů","s10a":"Uplatňujeme vhodná technická a organizační opatření (mj. šifrování SSL/TLS) zajišťující bezpečnost zpracovávaných údajů před neoprávněným přístupem či ztrátou.","s11T":"11. Kontakt","s11a":"Ve věcech ochrany osobních údajů nás prosím kontaktujte:","s12T":"12. Změny zásad ochrany soukromí","s12a":"Správce si vyhrazuje právo provádět změny těchto zásad ochrany soukromí. Změny budou zveřejňovány na této stránce spolu s datem aktualizace. Doporučujeme obsah dokumentu pravidelně sledovat."},"it":{"pageTitle":"Privacy e cookie","pageLead":"Come questo sito tratta i tuoi dati — in modo semplice e trasparente.","updated":"Ultimo aggiornamento: 30 luglio 2026","s1T":"1. Titolare del trattamento","s1a":"Il titolare del trattamento dei dati personali trattati nell’ambito di questo sito è la Fondazione Stock (Fundacja Stock), con sede a Lublino:","s2T":"2. Finalità del trattamento","s2a":"I dati personali sono trattati per le seguenti finalità:","s2l1":"Gestione delle richieste inviateci direttamente via e-mail o telefono — comprese le domande sull’attività della fondazione, collaborazioni, volontariato e donazioni.","s2l2":"Analisi del traffico sul sito e ottimizzazione dei contenuti.","s2l3":"Garanzia della sicurezza del sito.","s2l4":"Gestione dei consensi ai cookie e memorizzazione delle tue preferenze.","s2b":"Il conferimento dei dati è volontario; tuttavia, se ci contatti, è necessario per gestire la tua richiesta. Sulla base dei dati raccolti non adottiamo decisioni automatizzate con effetti giuridici né effettuiamo profilazione.","s3T":"3. Ambito dei dati trattati","s3aT":"Dati forniti volontariamente durante il contatto:","s3a":"Se ci contatti direttamente (via e-mail o telefono), trattiamo il tuo indirizzo e-mail, numero di telefono, nome e cognome e le altre informazioni che fornisci volontariamente durante la conversazione o nel contenuto del messaggio.","s3bT":"Dati raccolti automaticamente (analisi e log):","s3b":"Indirizzo IP del dispositivo, informazioni su browser e sistema operativo, tempo trascorso sul sito, pagine visitate, fonte di accesso al sito e preferenze relative ai cookie.","s4T":"4. Base giuridica del trattamento","s4l1":"Art. 6, par. 1, lett. a del GDPR (consenso) — per i cookie analitici opzionali (Google Analytics), installati esclusivamente con il tuo consenso.","s4l2":"Art. 6, par. 1, lett. f del GDPR (legittimo interesse) — per la gestione della corrispondenza, la sicurezza del sito, la memorizzazione delle tue preferenze sulla privacy (voci necessarie) e l’esercizio di eventuali pretese.","s5T":"5. Destinatari dei dati","s5a":"Il sito funziona grazie a fornitori esterni di servizi. I tuoi dati possono essere affidati alle seguenti categorie di soggetti:","s5l1":"Fornitori di servizi di hosting e tecnici che mantengono il sito.","s5l2":"Fornitori di servizi e-mail che gestiscono la nostra corrispondenza.","s5l3":"Fornitori di analisi: Google Ireland Limited (Google Analytics, Google Search Console).","s5l4":"Soggetti autorizzati ai servizi contabili e legali della fondazione.","s6T":"6. Strumenti di analisi e cookie","s6aT":"Cookie necessari e memoria locale:","s6a":"Indispensabili per il corretto funzionamento del sito — memorizzano la lingua selezionata (voce “fs-lang”) e la tua decisione sui cookie (voce “fs-consent”). Sono salvati nella memoria locale del browser (localStorage) sul tuo dispositivo e non possono essere disattivati.","s6bT":"Cookie analitici:","s6b":"Con il tuo consenso utilizziamo Google Analytics 4, fornito da Google Ireland Limited, per analizzare il traffico sul sito. Lo strumento non registra gli indirizzi IP completi degli utenti dell’UE e i dati riportati hanno carattere statistico. Le voci analitiche vengono installate solo dopo il consenso espresso nel banner dei cookie; il consenso può anche essere rifiutato.","s6cT":"Google Search Console:","s6c":"Utilizziamo questo strumento per monitorare la presenza del sito nei risultati di ricerca e ottimizzare i contenuti. Non comporta l’installazione di cookie sul tuo dispositivo.","s6d":"Non utilizziamo cookie di marketing né pubblicitari. Puoi gestire le tue preferenze in qualsiasi momento nel banner dei cookie o nelle impostazioni del browser.","s7T":"7. Trasferimento dei dati al di fuori del SEE","s7a":"In relazione all’uso degli strumenti di Google, i tuoi dati possono essere trasferiti verso Paesi terzi (ad es. gli USA). Tali soggetti garantiscono un adeguato livello di protezione dei dati grazie alla partecipazione a programmi come l’EU–US Data Privacy Framework.","s8T":"8. I tuoi diritti","s8a":"Hai il diritto di:","s8l1":"Accedere ai tuoi dati e rettificarli.","s8l2":"Cancellarli o limitarne il trattamento.","s8l3":"Portabilità dei dati.","s8l4":"Revocare il consenso ai cookie in qualsiasi momento (cancellando i dati del browser o modificando la scelta nel banner) — senza pregiudicare la liceità del trattamento effettuato prima della revoca.","s8l5":"Opporti al trattamento.","s8l6":"Presentare reclamo al Presidente dell’Ufficio polacco per la Protezione dei Dati Personali (PUODO), ul. Stawki 2, 00-193 Varsavia, Polonia.","s9T":"9. Periodo di conservazione","s9a":"La corrispondenza è conservata per il periodo necessario a gestire la richiesta e successivamente fino alla prescrizione di eventuali pretese (di norma non oltre 6 anni). Le preferenze salvate nella memoria locale del browser (lingua, decisione sui cookie) restano sul tuo dispositivo finché non le elimini. I dati in Google Analytics vengono cancellati automaticamente dopo il periodo di conservazione (massimo 14 mesi).","s10T":"10. Sicurezza dei dati","s10a":"Applichiamo adeguate misure tecniche e organizzative (tra cui la crittografia SSL/TLS) per garantire la sicurezza dei dati trattati contro l’accesso non autorizzato o la perdita.","s11T":"11. Contatto","s11a":"Per questioni relative alla protezione dei dati personali, contattaci:","s12T":"12. Modifiche alla presente informativa sulla privacy","s12a":"Il titolare si riserva il diritto di apportare modifiche alla presente informativa sulla privacy. Le modifiche saranno pubblicate su questa pagina insieme alla data di aggiornamento. Si consiglia di consultare regolarmente il contenuto del documento."}}/* /CONTENT */;
